[package]
name = "devbox-knowledge"
version = "0.8.0"
publish = false
edition = "2021"
authors = ["jihoon22.lee"]
description = "Devbox Knowledge development product shell"

[lib]
name = "devbox_knowledge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
devbox-applink = { package = "applink", path = "../../../crates/applink" }
tokio = { version = "1", features = ["net", "sync", "rt", "time", "io-util", "macros"] }
devbox-catalog = { package = "catalog", path = "../../../crates/catalog" }
tauri = { version = "2", features = ["tray-icon"] }
product-shell-tauri = { path = "../../../crates/product-shell-tauri" }

product-contract = { path = "../../../crates/product-contract" }
knowledge-base = { path = "../../knowledge-base/src-tauri", default-features = false }
life-log = { path = "../../life-log/src-tauri", default-features = false }
everything-plus = { path = "../../everything-plus/src-tauri", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
data-migration = { path = "../../../crates/data-migration" }
rusqlite = { version = "0.32", features = ["bundled", "backup", "hooks"] }
sha2 = "0.11.0"
devbox-wsl = { package = "wsl", path = "../../../crates/wsl" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
