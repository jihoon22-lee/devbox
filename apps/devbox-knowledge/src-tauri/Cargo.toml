[package]
name = "devbox-knowledge"
version = "0.8.1"
publish = false
edition = "2021"
authors = ["jihoon22.lee"]
description = "Devbox Knowledge development product shell"

[lib]
name = "devbox_knowledge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = { workspace = true }
serde_json = { workspace = true }
tauri-build = { workspace = true }

[dependencies]
suite-runtime = { path = "../../../crates/suite-runtime" }
devbox-applink = { package = "applink", path = "../../../crates/applink" }
tokio = { workspace = true }
devbox-catalog = { package = "catalog", path = "../../../crates/catalog" }
tauri = { workspace = true }
product-shell-tauri = { path = "../../../crates/product-shell-tauri" }

product-contract = { path = "../../../crates/product-contract" }
knowledge_vault_engine = { package = "devbox-knowledge-vault-engine", path = "../../../crates/knowledge-vault-engine", default-features = false }
activity_engine = { package = "devbox-activity-engine", path = "../../../crates/activity-engine", default-features = false }
content_index_engine = { package = "devbox-content-index-engine", path = "../../../crates/content-index-engine", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-opener = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
devbox-wsl = { package = "wsl", path = "../../../crates/wsl" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
