[package]
name = "devbox-workspace"
version = "0.8.1"
publish = false
edition = "2021"
authors = ["jihoon22.lee"]
description = "Devbox Workspace development product shell"

[lib]
name = "devbox_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = { workspace = true }
serde_json = { workspace = true }
tauri-build = { workspace = true }

[dependencies]
suite-runtime = { path = "../../../crates/suite-runtime" }
devbox-catalog = { package = "catalog", path = "../../../crates/catalog" }
workspace-wsl = { path = "../native", default-features = false, features = ["files", "git"] }
tauri = { workspace = true }
product-shell-tauri = { path = "../../../crates/product-shell-tauri" }
product-contract = { path = "../../../crates/product-contract" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["default"] }
window-state = { path = "../../../crates/window-state" }
window-state-tauri = { path = "../../../crates/window-state-tauri" }
uuid = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
devbox-wsl = { package = "wsl", path = "../../../crates/wsl" }
devbox-git = { package = "git", path = "../../../crates/git" }
workbench_lib = { package = "devbox-projects-engine", path = "../../../crates/projects-engine", default-features = false }
code_pad_lib = { package = "devbox-editor-engine", path = "../../../crates/editor-engine", default-features = false, features = ["desktop"] }
repo_manager_lib = { package = "devbox-repositories-engine", path = "../../../crates/repositories-engine", default-features = false, features = ["desktop"] }
run_manager_lib = { package = "devbox-runtime-engine", path = "../../../crates/runtime-engine", default-features = false, features = ["desktop"] }
port_manager_lib = { package = "devbox-ports-engine", path = "../../../crates/ports-engine", default-features = false, features = ["desktop"] }
wsl_desktop_lib = { package = "devbox-terminal-engine", path = "../../../crates/terminal-engine", default-features = false, features = ["desktop"] }
log_lens_lib = { package = "devbox-logs-engine", path = "../../../crates/logs-engine", default-features = false, features = ["desktop"] }
devbox-integration = { package = "integration", path = "../../../crates/integration" }
devbox-applink = { package = "applink", path = "../../../crates/applink" }
tauri-plugin-notification = { workspace = true }

sha2 = { workspace = true }
tokio = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-opener = { workspace = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
