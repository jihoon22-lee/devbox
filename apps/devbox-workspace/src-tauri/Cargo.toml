[package]
name = "devbox-workspace"
version = "0.8.0"
publish = false
edition = "2021"
authors = ["jihoon22.lee"]
description = "Devbox Workspace development product shell"

[lib]
name = "devbox_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = "0.11.0"
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
workspace-wsl = { path = "../native", default-features = false, features = ["files"] }
tauri = { version = "2", features = [] }
product-shell-tauri = { path = "../../../crates/product-shell-tauri" }
product-contract = { path = "../../../crates/product-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-state = { path = "../../../crates/window-state" }
window-state-tauri = { path = "../../../crates/window-state-tauri" }
uuid = { version = "1", features = ["v4"] }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
devbox-wsl = { package = "wsl", path = "../../../crates/wsl" }
devbox-git = { package = "git", path = "../../../crates/git" }
workbench = { path = "../../workbench/src-tauri", default-features = false }
code-pad = { path = "../../code-pad/src-tauri", default-features = false, features = ["desktop"] }
repo-manager = { path = "../../repo-manager/src-tauri", default-features = false, features = ["desktop"] }

sha2 = "0.11.0"
tokio = { version = "1", features = ["time", "sync", "process", "io-util", "rt", "macros"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
gix-config = { version = "=0.60.0", default-features = false, features = ["sha1"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
