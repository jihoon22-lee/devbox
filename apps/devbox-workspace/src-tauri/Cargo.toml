[package]
name = "devbox-workspace"
version = "0.8.0"
publish = false
edition = "2021"
authors = ["jihoon22.lee"]
description = "Devbox Workspace development product shell"

[lib]
name = "devbox_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
product-shell-tauri = { path = "../../../crates/product-shell-tauri" }
product-contract = { path = "../../../crates/product-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
devbox-wsl = { package = "wsl", path = "../../../crates/wsl" }

sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"
