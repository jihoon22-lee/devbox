[package]
name = "workspace-wsl"
version = "0.1.0"
publish = false
edition.workspace = true

[features]
default = ["helper"]
helper = ["files", "dep:libc", "code-pad/preview"]
files = ["dep:code-pad", "dep:product-contract", "dep:devbox-wsl", "dep:devbox-filesystem", "dep:sha2", "dep:windows"]

[lib]
name = "workspace_wsl"

[[bin]]
name = "devbox-workspace-wsl"
path = "src/main.rs"
required-features = ["helper"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem", optional = true }
sha2 = { version = "0.11.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[dependencies.code-pad]
path = "../../code-pad/src-tauri"
default-features = false
optional = true

[dependencies.product-contract]
path = "../../../crates/product-contract"
optional = true

[dependencies.devbox-wsl]
package = "wsl"
path = "../../../crates/wsl"
optional = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"], optional = true }

[dev-dependencies]
tempfile = "3"
