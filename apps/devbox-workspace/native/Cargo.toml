[package]
name = "workspace-wsl"
version = "0.1.0"
publish = false
edition.workspace = true

[features]
default = ["helper"]
test-fixtures = ["helper"]
helper = ["git", "files", "dep:libc", "code_pad_lib/preview", "dep:repo_manager_lib", "dep:tokio"]
files = ["dep:code_pad_lib", "dep:product-contract", "dep:devbox-wsl", "dep:devbox-filesystem", "dep:sha2", "dep:windows"]

git = ["files", "dep:devbox-git", "dep:gix-config"]

[lib]
name = "workspace_wsl"

[[bin]]
name = "devbox-workspace-wsl"
path = "src/main.rs"
required-features = ["helper"]

[dependencies]
gix-config = { version = "=0.60.0", default-features = false, features = ["sha1"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem", optional = true }
sha2 = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[dependencies.code_pad_lib]
package = "devbox-editor-engine"
path = "../../../crates/editor-engine"
default-features = false
optional = true

[dependencies.product-contract]
path = "../../../crates/product-contract"
optional = true

[dependencies.devbox-wsl]
package = "wsl"
path = "../../../crates/wsl"
optional = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[dependencies.devbox-git]
package = "git"
path = "../../../crates/git"
optional = true

[dependencies.repo_manager_lib]
package = "devbox-repositories-engine"
path = "../../../crates/repositories-engine"
default-features = false
optional = true

[dependencies.tokio]
workspace = true
optional = true

[[bin]]
name = "workspace-lsp-fixture"
path = "tests/support/lsp_fixture.rs"
required-features = ["test-fixtures"]
test = false

[[test]]
name = "lsp_pipe"
path = "tests/lsp_pipe.rs"
required-features = ["test-fixtures"]
