[package]
name = "code-pad"
version = "0.5.1"
publish = false
description = "Code Pad"
authors = ["jihoon22.lee"]
edition = "2021"
default-run = "code-pad"

[lib]
name = "code_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Product consumers reuse native components without embedding legacy web assets.
[features]
default = ["standalone"]
standalone = ["desktop"]
preview = ["dep:devbox-markdown"]
desktop = [
    "dep:tauri-build", "dep:tauri", "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance",
    "dep:devbox-window-state-tauri", "dep:devbox-applink", "preview", "dep:notify",
]

[[bin]]
name = "code-pad"
path = "src/main.rs"
required-features = ["standalone"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
encoding_rs = "0.8"
chardetng = "1"
base64 = "0.22"
sha2 = "0.11.0"
subtle = "2.6.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
lsp-types = "0.97.0"
notify = { version = "8.2.0", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
flate2 = "1.1.9"
tar = { version = "0.4.46", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
devbox-wsl = { package = "wsl", path = "../../../crates/wsl" }
devbox-window-state-tauri = { package = "window-state-tauri", path = "../../../crates/window-state-tauri", optional = true }
devbox-markdown = { package = "markdown", path = "../../../crates/markdown", optional = true }
devbox-applink = { package = "applink", path = "../../../crates/applink", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "fake-lsp-server"
path = "tests/fixtures/fake_lsp_server.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
]
}

[target.'cfg(unix)'.dependencies]
libc = "0.2"
