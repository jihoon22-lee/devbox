[package]
name = "code-pad"
version = "0.2.0"
description = "Code Pad"
authors = ["jihoon22.lee"]
edition = "2021"

[lib]
name = "code_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "1"
base64 = "0.22"
sha2 = "0.11.0"
url = "2"
notify = "8.2.0"
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
devbox-markdown = { package = "markdown", path = "../../../crates/markdown" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Storage_FileSystem",
]
}
