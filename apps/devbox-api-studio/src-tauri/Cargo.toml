[package]
name = "devbox-api-studio"
version = "0.8.1"
publish = false
edition = "2021"
authors = ["jihoon22.lee"]
description = "Devbox API Studio development product shell"

[lib]
name = "devbox_api_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
suite-runtime = { path = "../../../crates/suite-runtime" }
devbox-catalog = { package = "catalog", path = "../../../crates/catalog" }
dirs = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
webhook-core = { path = "../../../crates/webhook-core" }
transforms-core = { path = "../../../crates/transforms-core" }
tauri = { workspace = true }
product-shell-tauri = { path = "../../../crates/product-shell-tauri" }
product-contract = { path = "../../../crates/product-contract" }
http_client_engine = { package = "devbox-http-client-engine", path = "../../../crates/http-client-engine", default-features = false }
webhook_host = { package = "devbox-webhook-host", path = "../../../crates/webhook-host", default-features = false }
toolbox_engine = { package = "devbox-toolbox-engine", path = "../../../crates/toolbox-engine", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
applink = { path = "../../../crates/applink" }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
tauri = { workspace = true }
windows = { workspace = true }
webview2-com = { workspace = true }
