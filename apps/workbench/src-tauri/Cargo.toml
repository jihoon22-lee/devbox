[package]
name = "workbench"
version = "0.1.1"
publish = false
description = "Project Workspace Orchestrator"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
devbox-wsl = { package = "wsl", path = "../../../crates/wsl" }
devbox-integration = { package = "integration", path = "../../../crates/integration" }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
devbox-window-state-tauri = { package = "window-state-tauri", path = "../../../crates/window-state-tauri" }
devbox-launch = { package = "launch", path = "../../../crates/launch" }
devbox-git = { package = "git", path = "../../../crates/git" }
devbox-applink = { package = "applink", path = "../../../crates/applink" }
devbox-secrets = { package = "secrets", path = "../../../crates/secrets" }
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11.0"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
] }
