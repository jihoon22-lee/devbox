[package]
name = "devbox-launcher"
version = "0.2.0"
publish = false
description = "Devbox Launcher"
authors = ["jihoon22.lee"]
edition = "2021"

[lib]
name = "devbox_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
devbox-applink = { package = "applink", path = "../../../crates/applink" }
devbox-catalog = { package = "catalog", path = "../../../crates/catalog" }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
devbox-integration = { package = "integration", path = "../../../crates/integration" }
devbox-launch = { package = "launch", path = "../../../crates/launch" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
