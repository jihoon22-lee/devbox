[package]
name = "knowledge-base"
version = "0.5.1"
publish = false
description = "Knowledge Base"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "knowledge_base_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
dirs = "6.0.0"
base64 = "0.22"
markdown = { path = "../../../crates/markdown" }
search = { path = "../../../crates/search" }
notify = "8.2.0"
devbox-integration = { package = "integration", path = "../../../crates/integration" }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
devbox-window-state-tauri = { package = "window-state-tauri", path = "../../../crates/window-state-tauri" }
devbox-applink = { package = "applink", path = "../../../crates/applink" }
devbox-launch = { package = "launch", path = "../../../crates/launch" }
devbox-wsl = { package = "wsl", path = "../../../crates/wsl" }

[target.'cfg(windows)'.dependencies]
# RegisterHotKey/GetMessageW/MoveFileExW are used only on Windows.  This version is
# already present in the workspace lockfile via filesystem/run-manager, so
# the quick-capture feature adds no runtime download or sidecar.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
