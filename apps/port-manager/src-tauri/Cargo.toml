[package]
name = "port-manager"
version = "0.2.2"
publish = false
description = "Port & Process Manager"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "port_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
dirs = "6.0.0"
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
devbox-process = { package = "process", path = "../../../crates/process" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
devbox-wsl = { package = "wsl", path = "../../../crates/wsl" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }
