[package]
name = "webhook-lab"
version = "0.2.0"
publish = false
description = "Local Mock/Webhook Server"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "webhook_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
devbox-window-state-tauri = { package = "window-state-tauri", path = "../../../crates/window-state-tauri" }
devbox-applink = { package = "applink", path = "../../../crates/applink" }
devbox-integration = { package = "integration", path = "../../../crates/integration" }
devbox-launch = { package = "launch", path = "../../../crates/launch" }

[dev-dependencies]
tempfile = "3"
