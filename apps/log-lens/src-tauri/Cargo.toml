[package]
name = "log-lens"
version = "0.1.0"
publish = false
description = "Bounded local log viewer"
authors = ["jihoon22.lee"]
edition = "2021"

[lib]
name = "log_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
regex = "1"
tokio = { version = "1", features = ["rt"] }
wsl = { path = "../../../crates/wsl" }
devbox-window-state-tauri = { package = "window-state-tauri", path = "../../../crates/window-state-tauri" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
