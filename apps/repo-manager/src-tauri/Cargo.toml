[package]
name = "repo-manager"
version = "0.3.0"
publish = false
description = "Git Worktree Manager"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "repo_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Product consumers reuse native components without embedding legacy web assets.
[features]
default = ["standalone"]
standalone = ["desktop"]
desktop = ["dep:tauri-build", "dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance", "dep:devbox-window-state-tauri"]

[[bin]]
name = "repo-manager"
path = "src/main.rs"
required-features = ["standalone"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
devbox-wsl = { package = "wsl", path = "../../../crates/wsl" }
devbox-launch = { package = "launch", path = "../../../crates/launch" }
devbox-git = { package = "git", path = "../../../crates/git" }
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }
devbox-window-state-tauri = { package = "window-state-tauri", path = "../../../crates/window-state-tauri", optional = true }
devbox-applink = { package = "applink", path = "../../../crates/applink" }
devbox-integration = { package = "integration", path = "../../../crates/integration" }
sha2 = "0.11.0"
toml = "1.1.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
futures-util = "0.3"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "net"] }

[dev-dependencies]
tempfile = "3"
