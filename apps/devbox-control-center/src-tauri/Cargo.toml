[package]
name = "devbox-control-center"
version = "0.8.0"
publish = false
edition = "2021"
authors = ["jihoon22.lee"]
description = "Devbox Control Center development product shell"

[lib]
name = "devbox_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
devbox-manager = {path="../../devbox-manager/src-tauri",default-features=false}
tauri-plugin-dialog="2"
tauri-plugin-opener="2"
devbox-catalog = { package = "catalog", path = "../../../crates/catalog" }
product-contract = { path = "../../../crates/product-contract" }
data-migration = { path = "../../../crates/data-migration" }
tauri = { version = "2", features = [] }
product-shell-tauri = { path = "../../../crates/product-shell-tauri" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
devbox-filesystem = { package = "filesystem", path = "../../../crates/filesystem" }

uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "sync", "rt", "time", "io-util", "macros"] }


[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
