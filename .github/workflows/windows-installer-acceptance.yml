name: Windows installer acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published Suite tag
        required: true
        type: string
      source_commit:
        description: Exact tag commit; dispatch using that same tag or commit ref
        required: true
        type: string
      mode:
        description: Full installer acceptance or fresh public portable startup
        type: choice
        options: [full, smoke]
        default: full
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      mode:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: published-suite-acceptance-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: Fresh downloaded Suite identity and native acceptance
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
      SOURCE: ${{ inputs.source_commit }}
      DEVBOX_FIXTURE_PROFILE: release
      DEVBOX_PORTABLE_FIXTURES: target/portable-fixture
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify annotated source and freshly downloaded public assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:SOURCE -notmatch '^[a-f0-9]{40}$' -or $env:GITHUB_SHA -cne $env:SOURCE) { throw 'Exact workflow source and published tag required.' }
          if ('${{ inputs.mode }}' -notin @('full','smoke')) { throw 'Unknown acceptance scope.' }
          git fetch --no-tags origin "refs/tags/$env:TAG`:refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0 -or (git cat-file -t "refs/tags/$env:TAG").Trim() -cne 'tag' -or (git rev-parse "refs/tags/$env:TAG^{}").Trim() -cne $env:SOURCE) { throw 'Annotated release source differs.' }
          New-Item -ItemType Directory -Path public-assets,public-evidence | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir public-assets
          if ($LASTEXITCODE -ne 0) { throw 'Fresh release download failed.' }
          $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft) { throw 'Published release required.' }
          $release | Add-Member -NotePropertyName targetCommit -NotePropertyValue $env:SOURCE
          $release | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 public-evidence/release.json
          $preview = $release.isPrerelease.ToString().ToLowerInvariant()
          python .github/scripts/verify-downloaded-release.py --assets public-assets --release public-evidence/release.json --config .github/scripts/windows-packaged-smoke-config.json --tag $env:TAG --commit $env:SOURCE --draft false --prerelease $preview > public-evidence/readback.json
          if ($LASTEXITCODE -ne 0) { throw 'Fresh public byte identity failed.' }
      - name: Execute only the explicitly selected native acceptance scope
        shell: pwsh
        env:
          DEVBOX_SUITE_ARTIFACT_SOURCE: ${{ inputs.source_commit }}
          DEVBOX_SUITE_ARTIFACT_RUN: ${{ github.run_id }}
        run: |
          if ('${{ inputs.mode }}' -eq 'full') {
            python .github/scripts/prepare-suite-fixture.py public-assets public-delivery --source $env:SOURCE --run-id $env:GITHUB_RUN_ID
            if ($LASTEXITCODE -ne 0) { throw 'Delivery preparation failed.' }
            .github/scripts/windows-suite-delivery.ps1 -Staging public-delivery -Bootstrap public-delivery/devbox-suite-bootstrap.exe
          } else {
            python .github/scripts/prepare-suite-runtime.py public-assets --source $env:SOURCE
            if ($LASTEXITCODE -ne 0) { throw 'Runtime preparation failed.' }
            node .github/scripts/windows-product-foundation.mjs --smoke-only
            if ($LASTEXITCODE -ne 0) { throw 'Fresh portable startup failed.' }
          }
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: published-suite-acceptance-${{ github.run_id }}
          path: |
            public-evidence
            product-foundation-evidence
          if-no-files-found: error
          retention-days: 14
