name: Product foundation acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/devbox-workspace/**'
      - 'apps/devbox-api-studio/**'
      - 'apps/devbox-knowledge/**'
      - 'apps/devbox-control-center/**'
      - 'apps/products.json'
      - 'crates/product-*/**'
      - 'packages/product-shell/**'
      - 'packages/api-studio-features/**'
      - 'packages/knowledge-features/**'
      - 'packages/workspace-features/**'
      - 'apps/workbench/src-tauri/**'
      - 'apps/repo-manager/src-tauri/**'
      - 'apps/code-pad/src-tauri/**'
      - 'apps/run-manager/src-tauri/**'
      - 'apps/log-lens/src-tauri/**'
      - 'apps/port-manager/src-tauri/**'
      - 'apps/wsl-desktop/src-tauri/**'
      - 'crates/api-protocols/**'
      - 'crates/data-migration/**'
      - 'crates/webhook-core/**'
      - 'crates/transforms-core/**'
      - 'apps/api-playground/src-tauri/**'
      - 'apps/webhook-lab/src-tauri/**'
      - 'apps/developer-toolbox/src-tauri/**'
      - 'apps/knowledge-base/src-tauri/**'
      - 'apps/life-log/src-tauri/**'
      - 'apps/everything-plus/src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pnpm-lock.yaml'
      - '.github/scripts/windows-product-foundation.mjs'
      - '.github/scripts/windows-workspace-*'
      - '.github/scripts/copy-owned-terminal-profile.ps1'
      - '.github/scripts/workspace-wsl-*'
      - '.github/scripts/windows-api-migration.mjs'
      - '.github/scripts/windows-knowledge-migration.mjs'
      - '.github/scripts/windows-knowledge-wsl.*'
      - '.github/scripts/export-knowledge-wsl-fixtures.ps1'
      - '.github/scripts/run-knowledge-wsl-fixtures.ps1'
      - '.github/scripts/windows-api-lifecycle.mjs'
      - '.github/scripts/windows-api-workflow.mjs'
      - '.github/scripts/check-api-studio-routes.mjs'
      - '.github/scripts/check-knowledge-routes.mjs'
      - '.github/scripts/product-route-graph.mjs'
      - '.github/scripts/windows-process-identity.mjs'
      - '.github/scripts/windows-packaged-smoke.mjs'
      - '.github/scripts/windows-product-installation.ps1'
      - '.github/scripts/windows-installer-helpers.ps1'
      - '.github/scripts/product-foundation-baseline.json'
      - '.github/scripts/product-foundation-performance.*'
      - '.github/scripts/windows-product-performance.ps1'
      - '.github/scripts/measure-baseline-bundles.mjs'
      - '.github/workflows/product-foundation.yml'
  workflow_dispatch:
    inputs:
      wsl_fixture_artifact_only:
        description: Build only private Windows unit-test executables for an owned local WSL fixture
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: product-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-wsl-helper:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.wsl_fixture_artifact_only }}
    name: Workspace static WSL helper
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-wsl-musl
      - name: Prepare static Linux compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test and build native helper
        run: |
          node --test .github/scripts/workspace-wsl-artifact.test.mjs
          cargo test --locked -p workspace-wsl --features test-fixtures --target x86_64-unknown-linux-musl
          cargo build --locked --release -p workspace-wsl --target x86_64-unknown-linux-musl
          cargo build --locked --release -p workspace-wsl --features test-fixtures --bin workspace-lsp-fixture --target x86_64-unknown-linux-musl
          node .github/scripts/workspace-wsl-artifact.mjs prepare target/x86_64-unknown-linux-musl/release/devbox-workspace-wsl "$GITHUB_SHA"
          node .github/scripts/workspace-wsl-artifact.mjs verify "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: workspace-wsl-${{ github.sha }}
          path: |
            apps/devbox-workspace/src-tauri/resources/wsl/devbox-workspace-wsl
            apps/devbox-workspace/src-tauri/resources/wsl/manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: workspace-lsp-fixture-${{ github.sha }}
          path: target/x86_64-unknown-linux-musl/release/workspace-lsp-fixture
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: workspace-wsl-helper
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.wsl_fixture_artifact_only }}
    name: Hidden products (Windows native)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable repository-pinned pnpm
        run: corepack enable pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: devbox-product-foundation
          # Preserve compiled dependencies after a fixture fails; results are never cached.
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Check generated Workspace fixture requests
        run: node --test .github/scripts/windows-workspace-registration.test.mjs
      - name: Check native Workspace chooser driver
        shell: powershell
        run: .github/scripts/windows-workspace-file-dialog.test.ps1
      - uses: actions/download-artifact@v8
        with:
          name: workspace-wsl-${{ github.sha }}
          path: apps/devbox-workspace/src-tauri/resources/wsl
      - uses: actions/download-artifact@v8
        with:
          name: workspace-lsp-fixture-${{ github.sha }}
          path: target/native-lsp-fixture
      - name: Select separate test-only native LSP server
        shell: pwsh
        run: '"DEVBOX_WORKSPACE_LSP_FIXTURE=$((Resolve-Path target/native-lsp-fixture/workspace-lsp-fixture).Path)" >> $env:GITHUB_ENV'
      - name: Verify helper belongs to this product source
        run: node .github/scripts/workspace-wsl-artifact.mjs verify "${{ github.sha }}"
      - name: Prepare dedicated WSL1 filesystem fixture
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: pwsh
        run: .github/scripts/windows-knowledge-wsl.ps1
      - name: Inspect only the owned WSL backing path
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .github/scripts/windows-workspace-wsl-storage.ps1
      - name: Preserve WSL storage metadata before native tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-wsl-preflight-${{ github.run_id }}
          path: product-foundation-evidence/workspace-wsl-storage.json
          if-no-files-found: error
          retention-days: 7
      - name: Provision Git only in the owned WSL fixture
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .github/scripts/windows-workspace-wsl-git.ps1
      - name: Exercise packaged Workspace helper on owned WSL
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo test -p devbox-workspace --test wsl_native actual_packaged_helper_observes_owned_wsl_and_requires_explicit_start -- --ignored --exact --nocapture 2>&1 | Tee-Object -FilePath product-foundation-evidence/workspace-wsl-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p devbox-workspace --lib source_host::tests::owned_wsl_source_review_preserves_native_approval_and_changed_evidence -- --ignored --exact --nocapture 2>&1 | Tee-Object -FilePath product-foundation-evidence/workspace-wsl-source.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p devbox-workspace --lib source_host::wsl_execution_tests::owned_source_stage_commit_revocation_and_cancellation_keep_native_ownership -- --ignored --exact --nocapture 2>&1 | Tee-Object -FilePath product-foundation-evidence/workspace-wsl-source-execution.log
          exit $LASTEXITCODE
      - name: Preserve native WSL results before independent acceptance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-wsl-runtime-${{ github.run_id }}
          path: product-foundation-evidence/workspace-wsl-*
          if-no-files-found: error
          retention-days: 7
      - name: Run native authority and WAL fixtures on Windows
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo test -p product-contract -p devbox-control-center -p data-migration -p devbox-api-studio -p devbox-knowledge -p api-playground -p webhook-lab -p developer-toolbox -p devbox-workspace -- --test-threads=2 2>&1 | Tee-Object -FilePath product-foundation-evidence/native-authority.log
          exit $LASTEXITCODE
      - name: Preserve authority results before product packaging
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: product-native-authority-${{ github.run_id }}
          path: product-foundation-evidence/native-authority.log
          if-no-files-found: error
          retention-days: 7
      - name: Build unpublished product installers
        id: product-build
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          foreach ($product in @('workspace', 'api-studio', 'knowledge', 'control-center')) {
            pnpm --filter "devbox-$product" tauri build --debug --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "Product build failed: $product" }
          }
      - name: Exercise packaged shell and installation namespace isolation
        if: ${{ !cancelled() && steps.product-build.outcome == 'success' }}
        run: node .github/scripts/windows-product-foundation.mjs
      - name: Export Workspace build for owned local WSL2 WebView acceptance
        id: workspace-export
        if: ${{ !cancelled() && steps.product-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'workspace-webview-fixture'
          if (Test-Path $destination) { throw 'Fixture export destination already exists' }
          New-Item -ItemType Directory -Path (Join-Path $destination 'resources/wsl') -Force | Out-Null
          $files = [ordered]@{
            'devbox-workspace.exe' = 'target/debug/devbox-workspace.exe'
            'resources/wsl/devbox-workspace-wsl' = 'apps/devbox-workspace/src-tauri/resources/wsl/devbox-workspace-wsl'
            'resources/wsl/manifest.json' = 'apps/devbox-workspace/src-tauri/resources/wsl/manifest.json'
            'THIRD_PARTY_NOTICES.md' = 'THIRD_PARTY_NOTICES.md'
          }
          $records = @()
          foreach ($entry in $files.GetEnumerator()) {
            $target = Join-Path $destination $entry.Key
            Copy-Item -LiteralPath $entry.Value -Destination $target -ErrorAction Stop
            $records += @{ path = $entry.Key; size = (Get-Item -LiteralPath $target).Length; sha256 = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          @{ schemaVersion = 1; purpose = 'owned-workspace-webview-acceptance'; sourceSha = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT; platform = 'windows-x86_64'; buildProfile = 'debug'; files = $records } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $destination 'fixture.json') -Encoding utf8
      - name: Preserve Workspace acceptance executable for one day
        if: ${{ !cancelled() && steps.workspace-export.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-webview-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/workspace-webview-fixture
          retention-days: 1
          if-no-files-found: error
      - name: Preserve packaged shell results before migration acceptance
        if: ${{ !cancelled() && steps.product-build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: product-packaged-shell-${{ github.run_id }}
          path: product-foundation-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Verify API Studio migration from pinned legacy storage
        if: ${{ !cancelled() && steps.product-build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/windows-api-migration.mjs
      - name: Verify temporary listener and service worker lifetimes
        if: ${{ !cancelled() && steps.product-build.outcome == 'success' }}
        run: node .github/scripts/windows-api-lifecycle.mjs
      - name: Verify API Studio end-to-end local workflow
        if: ${{ !cancelled() && steps.product-build.outcome == 'success' }}
        run: node .github/scripts/windows-api-workflow.mjs
      - name: Verify Knowledge migration, vault ownership and window lifetime
        if: ${{ !cancelled() && steps.product-build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/windows-knowledge-migration.mjs
      - name: Remove only the owned WSL fixture distro
        if: ${{ always() }}
        timeout-minutes: 3
        shell: pwsh
        run: .github/scripts/windows-knowledge-wsl.ps1 -Cleanup
      - name: Verify anchor and product installer coexistence
        if: ${{ !cancelled() && steps.product-build.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/windows-product-installation.ps1
      - name: Preserve private acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: product-foundation-${{ github.run_id }}
          path: product-foundation-evidence
          if-no-files-found: error
          retention-days: 7

  baseline-performance:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.wsl_fixture_artifact_only }}
    name: Legacy performance baseline (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 3a23f49c85aa3c3d04b86f227e8aa184ef964085
          path: baseline-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable repository-pinned pnpm
        run: corepack enable pnpm
      - name: Measure pinned native baseline with synthetic fixtures
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/windows-product-performance.ps1
      - name: Build baseline route bundles
        id: baseline-bundles
        if: ${{ !cancelled() }}
        shell: pwsh
        working-directory: baseline-source
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Baseline dependency installation failed' }
          $config = Get-Content ../.github/scripts/product-foundation-performance.json -Raw | ConvertFrom-Json
          foreach ($app in $config.apps) {
            pnpm --filter $app build
            if ($LASTEXITCODE -ne 0) { throw "Baseline bundle build failed: $app" }
          }
      - name: Measure pinned initial bundle closures
        if: ${{ !cancelled() && steps.baseline-bundles.outcome == 'success' }}
        run: node .github/scripts/measure-baseline-bundles.mjs baseline-source performance-baseline/bundles.json
      - name: Preserve private baseline evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: product-foundation-performance-${{ github.run_id }}
          path: performance-baseline/*.json
          if-no-files-found: error
          retention-days: 7

  wsl-fixture-artifact:
    name: Knowledge WSL test executables (private)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.wsl_fixture_artifact_only }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: devbox-product-foundation
          # Preserve compiled dependencies after a fixture fails; results are never cached.
          cache-on-failure: true
      - name: Compile only explicit native WSL fixtures
        shell: pwsh
        run: .github/scripts/export-knowledge-wsl-fixtures.ps1
      - name: Preserve private test executables for one day
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-wsl-fixtures-${{ github.run_id }}
          path: knowledge-wsl-fixtures
          retention-days: 1
          if-no-files-found: error
