name: Product foundation acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/devbox-workspace/**'
      - 'apps/devbox-api-studio/**'
      - 'apps/devbox-knowledge/**'
      - 'apps/devbox-control-center/**'
      - 'apps/products.json'
      - 'crates/product-*/**'
      - 'packages/product-shell/**'
      - 'packages/api-studio-features/**'
      - 'packages/knowledge-features/**'
      - 'packages/workspace-features/**'
      - 'crates/projects-engine/**'
      - 'crates/repositories-engine/**'
      - 'crates/editor-engine/**'
      - 'crates/runtime-engine/**'
      - 'crates/logs-engine/**'
      - 'crates/ports-engine/**'
      - 'crates/terminal-engine/**'
      - 'crates/api-protocols/**'
      - 'crates/data-migration/**'
      - 'crates/webhook-core/**'
      - 'crates/transforms-core/**'
      - 'crates/http-client-engine/**'
      - 'crates/webhook-host/**'
      - 'crates/toolbox-engine/**'
      - 'crates/knowledge-vault-engine/**'
      - 'crates/activity-engine/**'
      - 'crates/content-index-engine/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pnpm-lock.yaml'
      - '.github/scripts/windows-product-foundation.mjs'
      - '.github/scripts/windows-suite-workflows.mjs'
      - '.github/scripts/windows-suite-delivery*'
      - '.github/scripts/windows-suite-legacy-cleanup.ps1'
      - '.github/scripts/build-suite-*'
      - '.github/scripts/windows-workspace-*'
      - '.github/scripts/copy-owned-terminal-profile.ps1'
      - '.github/scripts/workspace-wsl-*'
      - '.github/scripts/windows-api-migration.mjs'
      - '.github/scripts/windows-knowledge-migration.mjs'
      - '.github/scripts/windows-knowledge-wsl.*'
      - '.github/scripts/export-knowledge-wsl-fixtures.ps1'
      - '.github/scripts/run-knowledge-wsl-fixtures.ps1'
      - '.github/scripts/windows-api-lifecycle.mjs'
      - '.github/scripts/windows-api-workflow.mjs'
      - '.github/scripts/check-api-studio-routes.mjs'
      - '.github/scripts/check-knowledge-routes.mjs'
      - '.github/scripts/product-route-graph.mjs'
      - '.github/scripts/windows-process-identity.mjs'
      - '.github/scripts/windows-packaged-smoke.mjs'
      - '.github/scripts/windows-product-installation.ps1'
      - '.github/scripts/windows-installer-helpers.ps1'
      - '.github/scripts/product-foundation-baseline.json'
      - '.github/scripts/product-foundation-performance.*'
      - '.github/scripts/windows-product-performance.ps1'
      - '.github/scripts/measure-baseline-bundles.mjs'
      - '.github/workflows/product-foundation.yml'
  workflow_dispatch:
    inputs:
      delivery_completion_only:
        description: Finish failed Suite assembly and product-shell acceptance; retain prior domain passes
        type: boolean
        default: false
      delivery_scope:
        description: Completion scope; delivery retains already accepted shell and WSL2 evidence
        type: choice
        options: [remaining, delivery]
        default: remaining
      delivery_diagnostic_run:
        description: Reuse the original Suite setup and four products for delivery acceptance only
        type: string
        default: ''
      delivery_remaining_only:
        description: Finish updated uninstall, reviewed source cutover and legacy cleanup; retain restore/reinstall evidence
        type: boolean
        default: false
      delivery_rebuild_control_center:
        description: Rebuild only Control Center and its helper after proving the other retained product inputs unchanged
        type: boolean
        default: false
      suite_diagnostic_run:
        description: Reuse retained four-product executables for remaining suite acceptance
        type: string
        default: ''
      suite_remaining_only:
        description: Build four products without installers and finish foreign-installation and shared-surface checks
        type: boolean
        default: false
      wsl2_scope:
        description: Remaining acceptance scope (full runs ignore this option)
        type: choice
        options: [remaining, containers, multiplexers]
        default: remaining
      wsl2_build_only:
        description: Build only Workspace and run remaining Zellij/container/stopped-query acceptance
        type: boolean
        default: false
      wsl2_diagnostic_run:
        description: Reuse this original private Workspace artifact for isolated WSL2 acceptance without rebuilding
        type: string
        default: ''
      legacy_reference_only:
        description: Acquire fixed legacy installed-file identities on a disposable hosted VM without building products
        type: boolean
        default: false
      terminal_diagnostic_run:
        description: Reuse this prior foundation run's exact Workspace artifact for hosted companion diagnosis only
        type: string
        default: ''
      wsl_fixture_artifact_only:
        description: Build only private Windows unit-test executables for an isolated WSL fixture
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: product-foundation-${{ github.ref }}-${{ inputs.legacy_reference_only && 'legacy-reference' || inputs.delivery_diagnostic_run || inputs.wsl2_diagnostic_run || inputs.suite_diagnostic_run || inputs.terminal_diagnostic_run || 'full' }}
  cancel-in-progress: true

jobs:
  legacy-reference:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_reference_only }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Acquire fixed v0.7 installed-file identities on two owned roots
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/windows-legacy-installer-reference.ps1
      - name: Preserve reference provenance and result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: legacy-installer-reference-${{ github.run_id }}
          path: legacy-installer-reference.json
          if-no-files-found: error
          retention-days: 7

  delivery-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_diagnostic_run != '' }}
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.delivery_rebuild_control_center && 60 || 45 }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Acquire original Suite setup and payload
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.delivery_diagnostic_run }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid delivery source run' }
          $record = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $record.path -ne '.github/workflows/product-foundation.yml' -or $record.repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Unexpected delivery source workflow' }
          gh run download $env:SOURCE_RUN --name "suite-delivery-fixture-$env:SOURCE_RUN" --dir "$env:RUNNER_TEMP/suite-retained"
          if ($LASTEXITCODE -ne 0) { throw 'Original delivery artifact unavailable' }
          $source = Get-Content -Raw "$env:RUNNER_TEMP/suite-retained/suite-fixture-source.json" | ConvertFrom-Json
          $payload = Get-Content -Raw "$env:RUNNER_TEMP/suite-retained/suite-payload.json" | ConvertFrom-Json
          if ($source.runHeadSha -ne $record.head_sha -or $source.sourceSha -ne $payload.sourceSha -or $source.repository -ne $env:GITHUB_REPOSITORY -or $source.runId -ne $env:SOURCE_RUN) { throw 'Retained delivery source mismatch' }
          "DEVBOX_SUITE_ARTIFACT_SOURCE=$($source.sourceSha)" >> $env:GITHUB_ENV
          "DEVBOX_SUITE_ARTIFACT_RUN=$env:SOURCE_RUN" >> $env:GITHUB_ENV
          "DEVBOX_SUITE_TEST_STAGING=$env:RUNNER_TEMP/suite-retained" >> $env:GITHUB_ENV
      - name: Prepare Control Center build dependencies only when rebuilding
        if: inputs.delivery_rebuild_control_center
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.delivery_rebuild_control_center
      - uses: Swatinem/rust-cache@v2
        if: inputs.delivery_rebuild_control_center
        with:
          shared-key: devbox-product-foundation
          cache-on-failure: true
      - name: Rebuild only changed Control Center inputs and reassemble private delivery
        if: inputs.delivery_rebuild_control_center
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force product-foundation-evidence | Out-Null
          Start-Transcript -LiteralPath product-foundation-evidence/control-center-rebuild.log
          $destination = Join-Path $env:RUNNER_TEMP 'suite-rebuilt'
          .github/scripts/rebuild-suite-control-center.ps1 -Retained "$env:RUNNER_TEMP/suite-retained" -Output $destination
          "DEVBOX_SUITE_TEST_STAGING=$destination" >> $env:GITHUB_ENV
          "DEVBOX_SUITE_ARTIFACT_SOURCE=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "DEVBOX_SUITE_ARTIFACT_RUN=$env:GITHUB_RUN_ID" >> $env:GITHUB_ENV
          Stop-Transcript
      - name: Retain rebuilt private Suite before delivery execution
        if: inputs.delivery_rebuild_control_center
        uses: actions/upload-artifact@v7
        with:
          name: suite-delivery-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/suite-rebuilt
          if-no-files-found: error
          retention-days: 1
      - name: Exercise retained installed Suite delivery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: .github/scripts/windows-suite-delivery.ps1 -Staging $env:DEVBOX_SUITE_TEST_STAGING -Bootstrap "$env:DEVBOX_SUITE_TEST_STAGING/devbox-suite-bootstrap.exe" -RemainingOnly:([bool]::Parse("${{ inputs.delivery_remaining_only }}"))
      - name: Preserve focused delivery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: suite-delivery-diagnostic-${{ github.run_id }}
          path: product-foundation-evidence
          retention-days: 7

  suite-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite_diagnostic_run != '' }}
    name: Remaining suite workflow with retained executables
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Acquire original suite executables
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.suite_diagnostic_run }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid suite source run' }
          $record = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $record.path -ne '.github/workflows/product-foundation.yml' -or $record.repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Unexpected suite source workflow' }
          gh run download $env:SOURCE_RUN --name "suite-workflow-fixture-$env:SOURCE_RUN" --dir "$env:RUNNER_TEMP/suite-retained"
          if ($LASTEXITCODE -ne 0) { throw 'Original suite artifact unavailable' }
          $helper = Get-Content -Raw "$env:RUNNER_TEMP/suite-retained/apps/devbox-workspace/src-tauri/resources/wsl/manifest.json" | ConvertFrom-Json
          if ($helper.sourceSha -ne $record.head_sha) { throw 'Retained suite source mismatch' }
          New-Item -ItemType Directory -Force target/debug,apps/devbox-workspace/src-tauri/resources/wsl | Out-Null
          foreach ($product in @('workspace', 'api-studio', 'knowledge', 'control-center')) {
            Copy-Item -LiteralPath "$env:RUNNER_TEMP/suite-retained/target/debug/devbox-$product.exe" -Destination "target/debug/devbox-$product.exe" -ErrorAction Stop
          }
          Copy-Item -Path "$env:RUNNER_TEMP/suite-retained/apps/devbox-workspace/src-tauri/resources/wsl/*" -Destination apps/devbox-workspace/src-tauri/resources/wsl -ErrorAction Stop
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/suite-retained/THIRD_PARTY_NOTICES.md" -Destination THIRD_PARTY_NOTICES.md -ErrorAction Stop
          "DEVBOX_SUITE_ARTIFACT_SOURCE=$($record.head_sha)" >> $env:GITHUB_ENV
          "DEVBOX_SUITE_ARTIFACT_RUN=$env:SOURCE_RUN" >> $env:GITHUB_ENV
      - name: Finish only foreign-installation and shared-surface acceptance
        run: node .github/scripts/windows-suite-workflows.mjs --remaining
      - name: Preserve remaining suite evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: suite-remaining-${{ github.run_id }}
          path: product-foundation-evidence
          retention-days: 7
          if-no-files-found: error

  terminal-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.legacy_reference_only && inputs.terminal_diagnostic_run != '' }}
    name: Retained Workspace artifact companion diagnostic
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download the original private artifact without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUN: ${{ inputs.terminal_diagnostic_run }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DIAGNOSTIC_RUN -notmatch '^\d+$') { throw 'Invalid source run' }
          $record = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:DIAGNOSTIC_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $record.path -ne '.github/workflows/product-foundation.yml' -or $record.repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Unexpected source workflow' }
          gh run download $env:DIAGNOSTIC_RUN --name "workspace-webview-fixture-$env:DIAGNOSTIC_RUN" --dir "$env:RUNNER_TEMP/workspace-retained-fixture"
          if ($LASTEXITCODE -ne 0) { throw 'Exact source artifact unavailable' }
      - name: Prepare disposable hosted WSL1 fixture
        shell: pwsh
        run: .github/scripts/windows-knowledge-wsl.ps1
      - name: Diagnose only the companion restore failure
        env:
          DIAGNOSTIC_RUN: ${{ inputs.terminal_diagnostic_run }}
        shell: pwsh
        run: node .github/scripts/windows-workspace-terminal-diagnostic.mjs "$env:RUNNER_TEMP/workspace-retained-fixture" "$env:DIAGNOSTIC_RUN"
      - name: Remove the diagnostic VM's owned fixture
        if: ${{ always() }}
        shell: pwsh
        run: .github/scripts/windows-knowledge-wsl.ps1 -Cleanup
      - name: Retain bounded synthetic diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-terminal-diagnostic-${{ github.run_id }}
          path: product-foundation-evidence
          retention-days: 7
          if-no-files-found: error

  workspace-wsl-helper:
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && !inputs.legacy_reference_only && !inputs.wsl_fixture_artifact_only && inputs.terminal_diagnostic_run == '' && inputs.wsl2_diagnostic_run == '' && inputs.suite_diagnostic_run == '' && inputs.delivery_diagnostic_run == '') }}
    name: Workspace static WSL helper
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-wsl-musl
      - name: Prepare static Linux compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test and build native helper
        run: |
          if [ '${{ inputs.wsl2_build_only }}' != 'true' ] && [ '${{ inputs.suite_remaining_only }}' != 'true' ]; then
            node --test .github/scripts/workspace-wsl-artifact.test.mjs
            cargo test --locked -p workspace-wsl --features test-fixtures --target x86_64-unknown-linux-musl
          fi
          cargo build --locked --release -p workspace-wsl --target x86_64-unknown-linux-musl
          cargo build --locked --release -p workspace-wsl --features test-fixtures --bin workspace-lsp-fixture --target x86_64-unknown-linux-musl
          node .github/scripts/workspace-wsl-artifact.mjs prepare target/x86_64-unknown-linux-musl/release/devbox-workspace-wsl "$GITHUB_SHA"
          node .github/scripts/workspace-wsl-artifact.mjs verify "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: workspace-wsl-${{ github.sha }}
          path: |
            apps/devbox-workspace/src-tauri/resources/wsl/devbox-workspace-wsl
            apps/devbox-workspace/src-tauri/resources/wsl/manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: workspace-lsp-fixture-${{ github.sha }}
          path: target/x86_64-unknown-linux-musl/release/workspace-lsp-fixture
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: workspace-wsl-helper
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && !inputs.legacy_reference_only && !inputs.wsl_fixture_artifact_only && inputs.terminal_diagnostic_run == '' && inputs.wsl2_diagnostic_run == '' && inputs.suite_diagnostic_run == '' && inputs.delivery_diagnostic_run == '') }}
    name: Hidden products (Windows native)
    outputs:
      workspace_fixture_exported: ${{ steps.workspace-export.outcome }}
    runs-on: windows-2025
    # Four product builds plus installed-Suite and independent native scopes.
    # The prior review run used 58 minutes even with three early fixture exits.
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable repository-pinned pnpm
        run: corepack enable pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: devbox-product-foundation
          # Preserve compiled dependencies after a fixture fails; results are never cached.
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Check generated Workspace fixture requests
        if: ${{ !inputs.delivery_completion_only && !inputs.wsl2_build_only && !inputs.suite_remaining_only }}
        run: node --test .github/scripts/windows-workspace-registration.test.mjs
      - name: Check native Workspace chooser driver
        if: ${{ !inputs.delivery_completion_only && !inputs.wsl2_build_only && !inputs.suite_remaining_only }}
        shell: powershell
        run: .github/scripts/windows-workspace-file-dialog.test.ps1
      - uses: actions/download-artifact@v8
        with:
          name: workspace-wsl-${{ github.sha }}
          path: apps/devbox-workspace/src-tauri/resources/wsl
      - uses: actions/download-artifact@v8
        with:
          name: workspace-lsp-fixture-${{ github.sha }}
          path: target/native-lsp-fixture
      - name: Select separate test-only native LSP server
        if: ${{ !inputs.wsl2_build_only && !inputs.suite_remaining_only }}
        shell: pwsh
        run: '"DEVBOX_WORKSPACE_LSP_FIXTURE=$((Resolve-Path target/native-lsp-fixture/workspace-lsp-fixture).Path)" >> $env:GITHUB_ENV'
      - name: Verify helper belongs to this product source
        run: node .github/scripts/workspace-wsl-artifact.mjs verify "${{ github.sha }}"
      - name: Prepare dedicated WSL1 filesystem fixture
        if: ${{ !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() }}
        timeout-minutes: 10
        shell: pwsh
        run: .github/scripts/windows-knowledge-wsl.ps1
      - name: Inspect only the owned WSL backing path
        if: ${{ !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() }}
        shell: pwsh
        run: .github/scripts/windows-workspace-wsl-storage.ps1
      - name: Preserve WSL storage metadata before native tests
        if: ${{ !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-wsl-preflight-${{ github.run_id }}
          path: product-foundation-evidence/workspace-wsl-storage.json
          if-no-files-found: error
          retention-days: 7
      - name: Provision Git only in the owned WSL fixture
        if: ${{ !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() }}
        shell: pwsh
        run: .github/scripts/windows-workspace-wsl-git.ps1
      - name: Exercise packaged Workspace helper on owned WSL
        if: ${{ !inputs.delivery_completion_only && !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() }}
        shell: pwsh
        run: |
          cargo test -p devbox-workspace --test wsl_native actual_packaged_helper_observes_owned_wsl_and_requires_explicit_start -- --ignored --exact --nocapture 2>&1 | Tee-Object -FilePath product-foundation-evidence/workspace-wsl-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p devbox-workspace --lib source_host::tests::owned_wsl_source_review_preserves_native_approval_and_changed_evidence -- --ignored --exact --nocapture 2>&1 | Tee-Object -FilePath product-foundation-evidence/workspace-wsl-source.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p devbox-workspace --lib source_host::wsl_execution_tests::owned_source_stage_commit_revocation_and_cancellation_keep_native_ownership -- --ignored --exact --nocapture 2>&1 | Tee-Object -FilePath product-foundation-evidence/workspace-wsl-source-execution.log
          exit $LASTEXITCODE
      - name: Preserve native WSL results before independent acceptance
        if: ${{ !inputs.delivery_completion_only && !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-wsl-runtime-${{ github.run_id }}
          path: product-foundation-evidence/workspace-wsl-*
          if-no-files-found: error
          retention-days: 7
      # Windows unit/authority/WAL tests run once in CI's Windows Rust job.
      # This workflow owns actual packaged applications and hosted WSL fixtures.
      - name: Build unpublished product installers
        id: product-build
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if ('${{ inputs.wsl2_build_only }}' -eq 'true') {
            pnpm --filter devbox-workspace tauri build --debug --no-bundle
            if ($LASTEXITCODE -ne 0) { throw 'Workspace build failed' }
            exit 0
          }
          foreach ($product in @('workspace', 'api-studio', 'knowledge', 'control-center')) {
            if ('${{ inputs.suite_remaining_only }}' -eq 'true' -or ('${{ inputs.delivery_completion_only }}' -eq 'true' -and $product -ne 'control-center')) {
              pnpm --filter "devbox-$product" tauri build --debug --no-bundle
            } else {
              pnpm --filter "devbox-$product" tauri build --debug --bundles nsis
            }
            if ($LASTEXITCODE -ne 0) { throw "Product build failed: $product" }
          }
      - name: Assemble the private Suite installer from these four product binaries
        id: suite-build
        if: ${{ !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() && steps.product-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -LiteralPath product-foundation-evidence/suite-assembly.log
          cargo build -p devbox-control-center --bin devbox-suite-bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'Suite bootstrap compilation failed' }
          $payload = Join-Path $env:RUNNER_TEMP 'suite-native-payload'
          $staging = Join-Path $env:RUNNER_TEMP 'suite-native-staging'
          New-Item -ItemType Directory -Path $payload | Out-Null
          foreach ($product in @('workspace','api-studio','knowledge','control-center')) {
            New-Item -ItemType Directory -Path "$payload/$product" | Out-Null
            Copy-Item "target/debug/devbox-$product.exe" "$payload/$product/"
          }
          New-Item -ItemType Directory -Path "$payload/workspace/resources/wsl" -Force | Out-Null
          Copy-Item 'apps/devbox-workspace/src-tauri/resources/wsl/*' "$payload/workspace/resources/wsl/"
          New-Item -ItemType Directory -Path "$payload/control-center/resources/suite" -Force | Out-Null
          Copy-Item 'target/debug/devbox-suite-bootstrap.exe' "$payload/control-center/resources/suite/"
          Copy-Item THIRD_PARTY_NOTICES.md "$payload/"
          $version = (Get-Content -Raw apps/devbox-control-center/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $source = (git rev-parse HEAD).Trim()
          python .github/scripts/build-suite-package.py portables $payload $staging $version $source
          if ($LASTEXITCODE -ne 0) { throw 'Suite portable assembly failed' }
          # NSIS also ships Bin/makensis.exe; Tauri invokes the toolset-root exe.
          $nsis = Join-Path $env:LOCALAPPDATA 'tauri/NSIS/makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis -PathType Leaf)) { throw 'Expected the NSIS compiler already used by Tauri' }
          python .github/scripts/build-suite-installer.py $staging "$payload/control-center/resources/suite/devbox-suite-bootstrap.exe" --makensis $nsis
          if ($LASTEXITCODE -ne 0) { throw 'Suite installer assembly failed' }
          Copy-Item 'target/debug/devbox-suite-bootstrap.exe' "$staging/devbox-suite-bootstrap.exe"
          @{ sourceSha=$source; runHeadSha='${{ github.event.pull_request.head.sha || github.sha }}'; repository=$env:GITHUB_REPOSITORY; runId=$env:GITHUB_RUN_ID } | ConvertTo-Json | Set-Content -Encoding utf8 "$staging/suite-fixture-source.json"
          Stop-Transcript
      - name: Retain the Suite fixture before native execution
        if: ${{ steps.suite-build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: suite-delivery-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/suite-native-staging
          if-no-files-found: error
          retention-days: 1
      - name: Exercise Suite installation, data restore and data-preserving removal
        if: ${{ !cancelled() && steps.suite-build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: .github/scripts/windows-suite-delivery.ps1 -Staging "$env:RUNNER_TEMP/suite-native-staging" -Bootstrap "$env:RUNNER_TEMP/suite-native-staging/devbox-suite-bootstrap.exe"
      - name: Exercise packaged shell and installation namespace isolation
        if: ${{ (!inputs.delivery_completion_only || inputs.delivery_scope != 'delivery') && !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() && steps.product-build.outcome == 'success' }}
        run: node .github/scripts/windows-product-foundation.mjs
      - name: Export Workspace build for isolated WSL2 WebView acceptance
        id: workspace-export
        if: ${{ (!inputs.delivery_completion_only || inputs.delivery_scope != 'delivery') && !inputs.suite_remaining_only && !cancelled() && steps.product-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'workspace-webview-fixture'
          if (Test-Path $destination) { throw 'Fixture export destination already exists' }
          New-Item -ItemType Directory -Path (Join-Path $destination 'resources/wsl') -Force | Out-Null
          $files = [ordered]@{
            'devbox-workspace.exe' = 'target/debug/devbox-workspace.exe'
            'resources/wsl/devbox-workspace-wsl' = 'apps/devbox-workspace/src-tauri/resources/wsl/devbox-workspace-wsl'
            'resources/wsl/manifest.json' = 'apps/devbox-workspace/src-tauri/resources/wsl/manifest.json'
            'THIRD_PARTY_NOTICES.md' = 'THIRD_PARTY_NOTICES.md'
          }
          $records = @()
          foreach ($entry in $files.GetEnumerator()) {
            $target = Join-Path $destination $entry.Key
            Copy-Item -LiteralPath $entry.Value -Destination $target -ErrorAction Stop
            $records += @{ path = $entry.Key; size = (Get-Item -LiteralPath $target).Length; sha256 = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          @{ schemaVersion = 1; purpose = 'owned-workspace-webview-acceptance'; sourceSha = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT; platform = 'windows-x86_64'; buildProfile = 'debug'; files = $records } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $destination 'fixture.json') -Encoding utf8
      - name: Preserve Workspace acceptance executable for one day
        if: ${{ !cancelled() && steps.workspace-export.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-webview-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/workspace-webview-fixture
          retention-days: 1
          if-no-files-found: error
      - name: Preserve packaged shell results before migration acceptance
        if: ${{ !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() && steps.product-build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: product-packaged-shell-${{ github.run_id }}
          path: product-foundation-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Preserve focused suite executables for failure continuation
        if: ${{ !cancelled() && !inputs.wsl2_build_only && steps.product-build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: suite-workflow-fixture-${{ github.run_id }}
          path: |
            target/debug/devbox-workspace.exe
            target/debug/devbox-api-studio.exe
            target/debug/devbox-knowledge.exe
            target/debug/devbox-control-center.exe
            apps/devbox-workspace/src-tauri/resources/wsl
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 1
      - name: Verify four-product commands and artifact workflows
        if: ${{ !inputs.delivery_completion_only && !inputs.wsl2_build_only && !cancelled() && steps.product-build.outcome == 'success' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          if ('${{ inputs.suite_remaining_only }}' -eq 'true') {
            node .github/scripts/windows-suite-workflows.mjs --remaining
          } else {
            node .github/scripts/windows-suite-workflows.mjs
          }
          exit $LASTEXITCODE
      - name: Verify API Studio migration from pinned legacy storage
        if: ${{ !inputs.delivery_completion_only && !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() && steps.product-build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/windows-api-migration.mjs
      - name: Verify temporary listener and service worker lifetimes
        if: ${{ !inputs.delivery_completion_only && !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() && steps.product-build.outcome == 'success' }}
        run: node .github/scripts/windows-api-lifecycle.mjs
      - name: Verify API Studio end-to-end local workflow
        if: ${{ !inputs.delivery_completion_only && !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() && steps.product-build.outcome == 'success' }}
        run: node .github/scripts/windows-api-workflow.mjs
      - name: Verify Knowledge migration, vault ownership and window lifetime
        if: ${{ !inputs.delivery_completion_only && !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() && steps.product-build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/windows-knowledge-migration.mjs
      - name: Remove only the owned WSL fixture distro
        if: ${{ !inputs.wsl2_build_only && !inputs.suite_remaining_only && always() }}
        timeout-minutes: 3
        shell: pwsh
        run: .github/scripts/windows-knowledge-wsl.ps1 -Cleanup
      - name: Verify anchor and product installer coexistence
        if: ${{ !inputs.delivery_completion_only && !inputs.wsl2_build_only && !inputs.suite_remaining_only && !cancelled() && steps.product-build.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/windows-product-installation.ps1
      - name: Preserve private acceptance evidence
        if: ${{ !inputs.wsl2_build_only && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: product-foundation-${{ github.run_id }}
          path: product-foundation-evidence
          if-no-files-found: error
          retention-days: 7

  windows-wsl2:
    needs: windows
    if: ${{ always() && ((needs.windows.result == 'success' && needs.windows.outputs.workspace_fixture_exported == 'success') || (github.event_name == 'workflow_dispatch' && inputs.wsl2_diagnostic_run != '')) }}
    name: Workspace WSL2 and containers (isolated hosted VM)
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      ARTIFACT_SOURCE: ${{ github.sha }}
      ARTIFACT_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: inputs.wsl2_diagnostic_run == ''
        with:
          name: workspace-webview-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/workspace-webview-fixture
      - name: Acquire the original artifact for focused WSL2 acceptance
        if: inputs.wsl2_diagnostic_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.wsl2_diagnostic_run }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid source run' }
          $record = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $record.path -ne '.github/workflows/product-foundation.yml' -or $record.repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Unexpected source workflow' }
          gh run download $env:SOURCE_RUN --name "workspace-webview-fixture-$env:SOURCE_RUN" --dir "$env:RUNNER_TEMP/workspace-webview-fixture"
          if ($LASTEXITCODE -ne 0) { throw 'Exact source artifact unavailable' }
          $fixture = Get-Content -Raw "$env:RUNNER_TEMP/workspace-webview-fixture/fixture.json" | ConvertFrom-Json
          if ($fixture.runId -ne $env:SOURCE_RUN -or $fixture.sourceSha -notmatch '^[a-f0-9]{40}$') { throw 'Unexpected artifact metadata' }
          $commit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$($fixture.sourceSha)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or ($commit.sha -ne $record.head_sha -and $record.head_sha -notin @($commit.parents.sha))) { throw 'Artifact source does not belong to this workflow run' }
          "ARTIFACT_SOURCE=$($fixture.sourceSha)" >> $env:GITHUB_ENV
          "ARTIFACT_RUN=$env:SOURCE_RUN" >> $env:GITHUB_ENV
      - uses: actions/cache/restore@v6
        id: wsl2-rootfs-cache
        with:
          path: ${{ runner.temp }}/devbox-wsl-rootfs
          key: owned-wsl-rootfs-2a790896740b14d637dbdc583cce1ba081ac53b9e9cdb46dc09a2f73abbd9934
      - name: Prepare pinned WSL2 root filesystem
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $directory = Join-Path $env:RUNNER_TEMP 'devbox-wsl-rootfs'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $archive = Join-Path $directory 'ubuntu-rootfs.tar.gz'
          if (-not (Test-Path -LiteralPath $archive)) {
            Invoke-WebRequest -UseBasicParsing -TimeoutSec 180 -Uri 'https://cloud-images.ubuntu.com/wsl/releases/noble/current/ubuntu-noble-wsl-amd64-24.04lts.rootfs.tar.gz' -OutFile $archive
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2a790896740b14d637dbdc583cce1ba081ac53b9e9cdb46dc09a2f73abbd9934') { throw 'Owned root filesystem digest mismatch' }
      # Preserve verified input before the fixture, even when a later test fails.
      - uses: actions/cache/save@v6
        if: steps.wsl2-rootfs-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/devbox-wsl-rootfs
          key: owned-wsl-rootfs-2a790896740b14d637dbdc583cce1ba081ac53b9e9cdb46dc09a2f73abbd9934
      - name: Exercise the compiled artifact on an independent hosted WSL2 VM
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'devbox-wsl-rootfs/ubuntu-rootfs.tar.gz'
          $scope = if ('${{ inputs.wsl2_build_only }}' -eq 'true') { '${{ inputs.wsl2_scope }}' } else { 'all' }
          .github/scripts/windows-workspace-owned-wsl2.ps1 -Scope $scope -Archive $archive -Digest '2a790896740b14d637dbdc583cce1ba081ac53b9e9cdb46dc09a2f73abbd9934' -AppArtifact (Join-Path $env:RUNNER_TEMP 'workspace-webview-fixture') -NodeScript (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/windows-workspace-owned-wsl2.mjs') -SourceSha $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -ArtifactSourceSha $env:ARTIFACT_SOURCE -ArtifactRunId $env:ARTIFACT_RUN
      - name: Preserve isolated WSL2 acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-wsl2-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workspace-webview-fixture/*acceptance.json
            ${{ runner.temp }}/workspace-webview-fixture/wsl2-details
          if-no-files-found: warn
          retention-days: 7

  baseline-performance:
    if: ${{ !inputs.delivery_completion_only && !inputs.wsl2_build_only && !inputs.suite_remaining_only && ((github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && !inputs.legacy_reference_only && !inputs.wsl_fixture_artifact_only && inputs.terminal_diagnostic_run == '' && inputs.wsl2_diagnostic_run == '' && inputs.suite_diagnostic_run == '' && inputs.delivery_diagnostic_run == '')) }}
    name: Legacy performance baseline (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 3a23f49c85aa3c3d04b86f227e8aa184ef964085
          path: baseline-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable repository-pinned pnpm
        run: corepack enable pnpm
      - name: Measure pinned native baseline with synthetic fixtures
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/windows-product-performance.ps1
      - name: Build baseline route bundles
        id: baseline-bundles
        if: ${{ !cancelled() }}
        shell: pwsh
        working-directory: baseline-source
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Baseline dependency installation failed' }
          $config = Get-Content ../.github/scripts/product-foundation-performance.json -Raw | ConvertFrom-Json
          foreach ($app in $config.apps) {
            pnpm --filter $app build
            if ($LASTEXITCODE -ne 0) { throw "Baseline bundle build failed: $app" }
          }
      - name: Measure pinned initial bundle closures
        if: ${{ !cancelled() && steps.baseline-bundles.outcome == 'success' }}
        run: node .github/scripts/measure-baseline-bundles.mjs baseline-source performance-baseline/bundles.json
      - name: Preserve private baseline evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: product-foundation-performance-${{ github.run_id }}
          path: performance-baseline/*.json
          if-no-files-found: error
          retention-days: 7

  wsl-fixture-artifact:
    name: Knowledge WSL test executables (private)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.legacy_reference_only && inputs.wsl_fixture_artifact_only && inputs.terminal_diagnostic_run == '' && inputs.wsl2_diagnostic_run == '' && inputs.suite_diagnostic_run == '' && inputs.delivery_diagnostic_run == '' }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: devbox-product-foundation
          # Preserve compiled dependencies after a fixture fails; results are never cached.
          cache-on-failure: true
      - name: Compile only explicit native WSL fixtures
        shell: pwsh
        run: .github/scripts/export-knowledge-wsl-fixtures.ps1
      - name: Preserve private test executables for one day
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-wsl-fixtures-${{ github.run_id }}
          path: knowledge-wsl-fixtures
          retention-days: 1
          if-no-files-found: error
