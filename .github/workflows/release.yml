name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.4.0). Use a new tag each run."
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify immutable release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.contract.outputs.tag }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
      make_latest: ${{ steps.contract.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: contract
        name: Require a new release for an annotated tag at this source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag"
            exit 1
          fi
          if [[ -z "$(git ls-remote --tags --refs origin "refs/tags/$TAG")" ]]; then
            echo "remote tag $TAG does not exist"
            exit 1
          fi
          git fetch --force --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "release tag $TAG must be annotated"
            exit 1
          fi
          tag_commit=$(git rev-parse "refs/tags/$TAG^{}")
          if [[ "$tag_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "tag commit $tag_commit does not match workflow source $EXPECTED_COMMIT"
            exit 1
          fi
          existing_release_ids=$(gh api --paginate \
            "repos/jihoon22-lee/devbox/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [[ -n "$existing_release_ids" ]]; then
            echo "release $TAG already exists"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows installers
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - id: apps
        name: Resolve build targets from catalog
        shell: bash
        run: |
          list=$(python3 -c "import json;print(' '.join(a['id'] for a in json.load(open('apps/catalog.json'))['apps'] if a['release']))")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "빌드 대상: $list"

      - name: Build all apps (NSIS installers) with per-app staging
        shell: pwsh
        env:
          APPS: ${{ steps.apps.outputs.list }}
        run: |
          $apps = @($env:APPS -split ' ')
          $catalog = Get-Content 'apps/catalog.json' -Raw | ConvertFrom-Json
          foreach ($a in $apps) {
            Write-Host "===== Building $a =====" -ForegroundColor Cyan
            Push-Location "apps/$a"
            pnpm tauri build --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "build failed: $a" }
            Pop-Location

            # Cargo workspace라 산출물이 루트 target/에 모인다. 빌드 직후 그 앱의
            # 산출물만 staging으로 옮겨 이전 빌드 산출물이 섞이는 것을 막는다.
            $entry = $catalog.apps | Where-Object { $_.id -eq $a }
            $conf = Get-Content "apps/$a/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
            # 휴대용 exe는 productName이 아니라 crate 패키지명(<package>.exe)으로 생성된다.
            $portable  = "target/release/$($entry.cargoPackage).exe"
            $installer = "target/release/bundle/nsis/$($conf.productName)_$($conf.version)_x64-setup.exe"

            New-Item -ItemType Directory -Force -Path "staging/$a/portable"   | Out-Null
            New-Item -ItemType Directory -Force -Path "staging/$a/installer"  | Out-Null
            Move-Item -Force $portable  "staging/$a/portable/$a.exe"
            # productName에 공백이 있으면 GitHub가 asset명 공백을 '.'으로 치환한다.
            # URL 안전하고 검증 가능한 이름(<app-id>_<version>_x64-setup.exe)으로 rename한다.
            Move-Item -Force $installer "staging/$a/installer/$($a)_$($conf.version)_x64-setup.exe"
          }

      - name: Stage third-party notices
        shell: pwsh
        run: Copy-Item -Force THIRD_PARTY_NOTICES.md staging/THIRD_PARTY_NOTICES.md

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: staging/**
          if-no-files-found: error

      - name: Generate release manifest
        id: manifest
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
        run: |
          python3 .github/scripts/build-manifest.py staging "$TAG" apps/catalog.json staging/release-manifest.json
          echo "path=staging/release-manifest.json" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: staging/release-manifest.json
          if-no-files-found: error

  publish:
    name: Stage draft release
    needs: [preflight, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: artifacts/staging

      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: artifacts/staging

      - name: Extract changelog section
        id: notes
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          python3 .github/scripts/extract-release-notes.py CHANGELOG.md "$TAG" > /tmp/release-notes.md
          echo "path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Atomically create a new draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          existing_release_ids=$(gh api --paginate \
            "repos/jihoon22-lee/devbox/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [[ -n "$existing_release_ids" ]]; then
            echo "release $TAG already exists"
            exit 1
          fi
          shopt -s nullglob
          assets=(
            artifacts/staging/*/portable/*.exe
            artifacts/staging/*/installer/*.exe
            artifacts/staging/THIRD_PARTY_NOTICES.md
            artifacts/staging/release-manifest.json
          )
          if [[ ${#assets[@]} -ne 32 ]]; then
            echo "draft release requires exactly 32 staged assets"
            exit 1
          fi
          command=(
            gh release create "$TAG"
            --repo jihoon22-lee/devbox
            --verify-tag
            --draft
            --title "devbox $TAG"
            --notes-file "$NOTES_FILE"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            command+=(--prerelease)
          fi
          "${command[@]}" "${assets[@]}"

  verify:
    name: Verify and publish release
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Independently verify the complete downloaded release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_commit=$(git rev-parse "$TAG^{}")
          if [[ "$tag_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "tag commit $tag_commit does not match workflow source $EXPECTED_COMMIT"
            exit 1
          fi
          prerelease=false
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
          fi

          mkdir downloaded-release
          gh release download "$TAG" --repo jihoon22-lee/devbox --dir downloaded-release
          gh release view "$TAG" --repo jihoon22-lee/devbox \
            --json tagName,isDraft,isPrerelease,targetCommitish,assets \
            | jq --arg targetCommit "$EXPECTED_COMMIT" '. + {targetCommit: $targetCommit}' \
            > downloaded-release-metadata.json

          python3 .github/scripts/verify-downloaded-release.py \
            --assets downloaded-release \
            --release downloaded-release-metadata.json \
            --config .github/scripts/windows-packaged-smoke-config.json \
            --tag "$TAG" \
            --commit "$EXPECTED_COMMIT" \
            --draft true \
            --prerelease "$prerelease"

      - name: Publish only the verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --repo jihoon22-lee/devbox --draft=false --prerelease
          elif [[ "$MAKE_LATEST" == "true" ]]; then
            gh release edit "$TAG" --repo jihoon22-lee/devbox --draft=false --latest
          else
            echo "invalid release publication state"
            exit 1
          fi
          gh release view "$TAG" --repo jihoon22-lee/devbox \
            --json tagName,isDraft,isPrerelease \
            | jq -e \
                --arg tag "$TAG" \
                --argjson prerelease "$PRERELEASE" \
                '.tagName == $tag and .isDraft == false and
                 .isPrerelease == $prerelease'
          gh release list --repo jihoon22-lee/devbox --limit 100 \
            --json tagName,isLatest \
            | jq -e \
                --arg tag "$TAG" \
                --argjson latest "$MAKE_LATEST" \
                'any(.[]; .tagName == $tag and .isLatest == $latest)'
