name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release tag (e.g. v0.6.0). Prereleases require the explicit gate below."
        required: true
        type: string
      allow_prerelease:
        description: "Explicitly authorize this exact prerelease tag (default: false)."
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify immutable release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.contract.outputs.tag }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
      make_latest: ${{ steps.contract.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: contract
        name: Validate release policy and require an annotated tag at this source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_PRERELEASE: ${{ inputs.allow_prerelease || false }}
        run: |
          set -euo pipefail
          # This is the first policy check in the release graph. In particular,
          # a prerelease push fails here, before any Windows build or release API
          # mutation can run. The script also emits the only prerelease/latest
          # state consumed by downstream jobs.
          python3 .github/scripts/validate-release-input.py \
            --event "$EVENT_NAME" \
            --tag "$TAG" \
            --allow-prerelease "$ALLOW_PRERELEASE" \
            --github-output "$GITHUB_OUTPUT"
          if [[ -z "$(git ls-remote --tags --refs origin "refs/tags/$TAG")" ]]; then
            echo "remote tag $TAG does not exist"
            exit 1
          fi
          git fetch --force --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "release tag $TAG must be annotated"
            exit 1
          fi
          tag_commit=$(git rev-parse "refs/tags/$TAG^{}")
          if [[ "$tag_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "tag commit $tag_commit does not match workflow source $EXPECTED_COMMIT"
            exit 1
          fi
          existing_release_ids=$(gh api --paginate \
            "repos/jihoon22-lee/devbox/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [[ -n "$existing_release_ids" ]]; then
            echo "release $TAG already exists"
            exit 1
          fi

  prerelease-wsl-helper:
    name: Build explicit preview Workspace component
    needs: preflight
    if: ${{ needs.preflight.outputs.prerelease == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-wsl-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: |
          cargo build --locked --release -p workspace-wsl --target x86_64-unknown-linux-musl
          node .github/scripts/workspace-wsl-artifact.mjs prepare target/x86_64-unknown-linux-musl/release/devbox-workspace-wsl "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: explicit-preview-workspace-component
          path: apps/devbox-workspace/src-tauri/resources/wsl/
          if-no-files-found: error

  build-prerelease-windows:
    name: Build explicitly authorized preview Suite
    needs: [preflight, prerelease-wsl-helper]
    if: ${{ needs.preflight.outputs.prerelease == 'true' }}
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: devbox-windows-package
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: explicit-preview-workspace-component
          path: apps/devbox-workspace/src-tauri/resources/wsl
      - name: Stage the pinned helper for Knowledge document operations
        run: node .github/scripts/workspace-wsl-artifact.mjs stage-knowledge "${{ github.sha }}"
      - name: Build the four-product preview only behind the explicit gate
        shell: pwsh
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          .github/scripts/build-windows-packages.ps1 -StagingRoot prerelease/shards/all
          .github/scripts/assemble-suite-candidate.ps1 -Shards prerelease/shards -Output prerelease/output -Tag $env:TAG -Source $env:GITHUB_SHA -AllowPrerelease
      - uses: actions/upload-artifact@v7
        with:
          name: explicit-preview-suite
          path: prerelease/output/assets
          if-no-files-found: error

  publish:
    name: Stage draft release
    needs: [preflight, build-prerelease-windows]
    if: >-
      ${{
        always() &&
        needs.preflight.result == 'success' &&
        (
          (needs.preflight.outputs.prerelease == 'false' && needs.build-prerelease-windows.result == 'skipped') ||
          (needs.preflight.outputs.prerelease == 'true' && needs.build-prerelease-windows.result == 'success')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - id: candidate
        name: Resolve the exact successful stable candidate
        if: ${{ needs.preflight.outputs.prerelease == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve-release-candidate.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$EXPECTED_COMMIT" \
            --tag "$TAG" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download the exact stable candidate
        if: ${{ needs.preflight.outputs.prerelease == 'false' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}

      - name: Independently verify candidate assets and provenance
        if: ${{ needs.preflight.outputs.prerelease == 'false' }}
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_COMMIT: ${{ github.sha }}
          CANDIDATE_RUN: ${{ steps.candidate.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-downloaded-release.py \
            --artifact-kind candidate \
            --assets candidate/assets \
            --release candidate/evidence/candidate-metadata.json \
            --config .github/scripts/windows-packaged-smoke-config.json \
            --tag "$TAG" \
            --commit "$EXPECTED_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run "$CANDIDATE_RUN" \
            | tee candidate-promotion-verification.json

      - uses: actions/download-artifact@v8
        if: ${{ needs.preflight.outputs.prerelease == 'true' }}
        with:
          name: explicit-preview-suite
          path: artifacts/assets

      - name: Extract changelog section
        id: notes
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          python3 .github/scripts/extract-release-notes.py CHANGELOG.md "$TAG" > /tmp/release-notes.md
          echo "path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Atomically create a new draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
          CANDIDATE_RUN_URL: ${{ steps.candidate.outputs.run_url }}
        run: |
          set -euo pipefail
          existing_release_ids=$(gh api --paginate \
            "repos/jihoon22-lee/devbox/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [[ -n "$existing_release_ids" ]]; then
            echo "release $TAG already exists"
            exit 1
          fi
          shopt -s nullglob
          if [[ "$PRERELEASE" == "false" ]]; then
            assets=(candidate/assets/*)
          else
            assets=(artifacts/assets/*)
          fi
          if [[ ${#assets[@]} -ne 7 ]]; then
            echo "draft release requires exactly 7 staged assets"
            exit 1
          fi
          command=(
            gh release create "$TAG"
            --repo jihoon22-lee/devbox
            --verify-tag
            --draft
            --title "devbox $TAG"
            --notes-file "$NOTES_FILE"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            command+=(--prerelease)
          fi
          "${command[@]}" "${assets[@]}"
          if [[ "$PRERELEASE" == "false" ]]; then
            {
              echo "### Promoted Windows package candidate"
              echo "- candidate run: $CANDIDATE_RUN_URL"
              echo "- contract: 4 products / 7 files / 6 manifest-declared / mismatch 0"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    name: Verify and publish release
    needs: [preflight, publish]
    if: >-
      ${{
        always() &&
        needs.preflight.result == 'success' &&
        needs.publish.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Independently verify the complete downloaded release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_COMMIT: ${{ github.sha }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_commit=$(git rev-parse "$TAG^{}")
          if [[ "$tag_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "tag commit $tag_commit does not match workflow source $EXPECTED_COMMIT"
            exit 1
          fi
          mkdir downloaded-release
          gh release download "$TAG" --repo jihoon22-lee/devbox --dir downloaded-release
          gh release view "$TAG" --repo jihoon22-lee/devbox \
            --json tagName,isDraft,isPrerelease,targetCommitish,assets \
            | jq --arg targetCommit "$EXPECTED_COMMIT" '. + {targetCommit: $targetCommit}' \
            > downloaded-release-metadata.json

          python3 .github/scripts/verify-downloaded-release.py \
            --assets downloaded-release \
            --release downloaded-release-metadata.json \
            --config .github/scripts/windows-packaged-smoke-config.json \
            --tag "$TAG" \
            --commit "$EXPECTED_COMMIT" \
            --draft true \
            --prerelease "$PRERELEASE"

      - name: Publish only the verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --repo jihoon22-lee/devbox --draft=false --prerelease
          elif [[ "$MAKE_LATEST" == "true" ]]; then
            gh release edit "$TAG" --repo jihoon22-lee/devbox --draft=false --latest
          else
            echo "invalid release publication state"
            exit 1
          fi
          gh release view "$TAG" --repo jihoon22-lee/devbox \
            --json tagName,isDraft,isPrerelease \
            | jq -e \
                --arg tag "$TAG" \
                --argjson prerelease "$PRERELEASE" \
                '.tagName == $tag and .isDraft == false and
                 .isPrerelease == $prerelease'
          gh release list --repo jihoon22-lee/devbox --limit 100 \
            --json tagName,isLatest \
            | jq -e \
                --arg tag "$TAG" \
                --argjson latest "$MAKE_LATEST" \
                'any(.[]; .tagName == $tag and .isLatest == $latest)'

  published-runtime:
    name: Fresh public download and four-product startup
    needs: [preflight, verify]
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.prerelease == 'false' && needs.verify.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/windows-installer-acceptance.yml
    with:
      release_tag: ${{ needs.preflight.outputs.tag }}
      source_commit: ${{ github.sha }}
      mode: smoke
