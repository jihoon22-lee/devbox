name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0). Use a new tag each run."
        required: true
        default: "v0.1.0"

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build all apps (NSIS installers)
        shell: pwsh
        run: |
          $apps = @(
            "port-manager","developer-toolbox","api-playground",
            "activity-timeline","everything-plus","knowledge-base","life-log",
            "wsl-desktop","devbox-manager","code-pad","run-manager"
          )
          foreach ($a in $apps) {
            Write-Host "===== Building $a =====" -ForegroundColor Cyan
            Push-Location "apps/$a"
            pnpm tauri build --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "build failed: $a" }
            Pop-Location
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          # devbox는 Cargo workspace라 산출물이 워크스페이스 루트 target/에 생긴다
          path: |
            target/release/*.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          awk -v h="## [$TAG]" '
            index($0, h) == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "CHANGELOG.md에 [$TAG] 섹션이 없습니다. 버전에 맞는 변경점을 기록해주세요." > /tmp/release-notes.md
          fi
          echo "path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: devbox ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: installers/**/*.exe
          draft: false
          make_latest: true
