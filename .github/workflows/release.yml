name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.4.0). Use a new tag each run."
        required: true

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - id: apps
        name: Resolve build targets from catalog
        shell: bash
        run: |
          list=$(python3 -c "import json;print(' '.join(a['id'] for a in json.load(open('apps/catalog.json'))['apps'] if a['release']))")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "빌드 대상: $list"

      - name: Build all apps (NSIS installers) with per-app staging
        shell: pwsh
        env:
          APPS: ${{ steps.apps.outputs.list }}
        run: |
          $apps = @($env:APPS -split ' ')
          $catalog = Get-Content 'apps/catalog.json' -Raw | ConvertFrom-Json
          foreach ($a in $apps) {
            Write-Host "===== Building $a =====" -ForegroundColor Cyan
            Push-Location "apps/$a"
            pnpm tauri build --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "build failed: $a" }
            Pop-Location

            # Cargo workspace라 산출물이 루트 target/에 모인다. 빌드 직후 그 앱의
            # 산출물만 staging으로 옮겨 이전 빌드 산출물이 섞이는 것을 막는다.
            $entry = $catalog.apps | Where-Object { $_.id -eq $a }
            $conf = Get-Content "apps/$a/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
            # 휴대용 exe는 productName이 아니라 crate 패키지명(<package>.exe)으로 생성된다.
            $portable  = "target/release/$($entry.cargoPackage).exe"
            $installer = "target/release/bundle/nsis/$($conf.productName)_$($conf.version)_x64-setup.exe"

            New-Item -ItemType Directory -Force -Path "staging/$a/portable"   | Out-Null
            New-Item -ItemType Directory -Force -Path "staging/$a/installer"  | Out-Null
            Move-Item -Force $portable  "staging/$a/portable/$a.exe"
            # productName에 공백이 있으면 GitHub가 asset명 공백을 '.'으로 치환한다.
            # URL 안전하고 검증 가능한 이름(<app-id>_<version>_x64-setup.exe)으로 rename한다.
            Move-Item -Force $installer "staging/$a/installer/$($a)_$($conf.version)_x64-setup.exe"
          }

      - name: Stage third-party notices
        shell: pwsh
        run: Copy-Item -Force THIRD_PARTY_NOTICES.md staging/THIRD_PARTY_NOTICES.md

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: staging/**
          if-no-files-found: error

      - name: Generate release manifest
        id: manifest
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
        run: |
          python3 .github/scripts/build-manifest.py staging "$TAG" apps/catalog.json staging/release-manifest.json
          echo "path=staging/release-manifest.json" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: staging/release-manifest.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: artifacts/staging

      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: artifacts/staging

      - name: Determine tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$PUSH_TAG"
          else
            tag="$DISPATCH_TAG"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"; exit 1
          fi

      - name: Extract changelog section
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 .github/scripts/extract-release-notes.py CHANGELOG.md "$TAG" > /tmp/release-notes.md
          echo "path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: devbox ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            artifacts/staging/**/*.exe
            artifacts/staging/THIRD_PARTY_NOTICES.md
            artifacts/staging/release-manifest.json
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.make_latest }}

  verify:
    name: Verify release assets against manifest
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: manifest

      - name: Verify assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
        run: |
          python3 .github/scripts/verify-release.py "jihoon22-lee/devbox" "$TAG" manifest/release-manifest.json "$GH_TOKEN"
