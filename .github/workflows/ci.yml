name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 버전은 package.json의 "packageManager" 필드를 따름 (여기서 중복 지정 금지)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontends
        run: pnpm build

      - name: Test frontends
        run: pnpm test

      - name: Type check
        if: ${{ hashFiles('apps/*/tsconfig.json', 'packages/*/tsconfig.json') != '' }}
        run: pnpm -r exec tsc --noEmit

  rust:
    name: Rust (Cargo workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 계획 단계에는 앱/크레이트가 없어서 Cargo 단계는 전부 건너뛴다.
      - name: Install Linux system libs
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: cargo check --workspace

      - name: Clippy
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: cargo fmt --all --check

      - name: Test
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: cargo test --workspace

  rust-windows:
    name: Rust (Windows compile check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # devbox는 Windows 타깃 Tauri 앱 모노레포지만 위 rust 잡은 ubuntu에서만
      # 돈다. #[cfg(target_os = "windows")] 코드는 여기서만 실제로 컴파일된다.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Windows는 WebView2를 쓰므로 ubuntu 잡의 GTK/webkit 시스템 라이브러리
      # 설치 단계가 필요 없다.

      # 캐시가 없으면 Tauri 의존성을 매번 새로 빌드해 20분 이상 걸린다.
      - uses: Swatinem/rust-cache@v2

      - name: Check
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: cargo check --workspace

      - name: Clippy
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      # fmt 검사는 위 rust(ubuntu) 잡이 이미 수행하므로 여기서는 생략한다.

      - name: Test
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: cargo test --workspace
