name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontends
        run: pnpm build

      - name: Type check
        if: ${{ hashFiles('apps/*/tsconfig.json', 'packages/*/tsconfig.json') != '' }}
        run: pnpm -r exec tsc --noEmit

  rust:
    name: Rust (Cargo workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 계획 단계에는 앱/크레이트가 없어서 Cargo 단계는 전부 건너뛴다.
      - name: Install Linux system libs
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: cargo check --workspace

      - name: Clippy
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: cargo fmt --all --check

      - name: Test
        if: ${{ hashFiles('apps/*/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') != '' }}
        run: cargo test --workspace
