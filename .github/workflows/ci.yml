name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # 바뀐 파일이 docs/ 와 루트 Markdown뿐이면 무거운 job을 건너뛴다(계획 갱신에 전체 CI를 돌리지 않음, 사용자 요청 2026-10-08).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$EVENT" = "push" ] && [ "$BASE" = "0000000000000000000000000000000000000000" ]; }; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}"; then
              echo "Scope gate: missing or unreadable baseline commit: $BASE" >&2
              exit 1
            fi
            # Count both sides of renames. Diff errors abort before classification.
            git diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/devbox-changed-files"
            status=0
            grep -vE '^(docs/|[^/]+\.md$)' "$RUNNER_TEMP/devbox-changed-files" > /dev/null || status=$?
            case "$status" in
              0) echo "code=true" >> "$GITHUB_OUTPUT" ;;
              1) echo "code=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "Scope gate: file classification failed (grep exit $status)" >&2; exit "$status" ;;
            esac
          fi
  rust:
    name: Rust (Cargo workspace)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: command -v systemd-analyze
      - run: python3 scripts/verify-resources.py -- python3 -m unittest discover -s scripts/tests
      - run: python3 scripts/verify-resources.py -- cargo fmt --all --check
      - run: python3 scripts/verify-resources.py -- cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
      - run: |
          python3 scripts/verify-resources.py -- cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib core:: -- --test-threads=2
      - run: python3 scripts/verify-resources.py -- cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 scripts/verify-resources.py -- cargo test --workspace --locked --no-fail-fast
      - run: bash scripts/banned-words.sh
      - run: python3 scripts/verify-resources.py -- cargo run -q -p xtask -- gen-ts --check
  frontend:
    name: Frontend (pnpm)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: python3 scripts/verify-resources.py -- pnpm --filter app typecheck
      - run: python3 scripts/verify-resources.py -- pnpm --filter app test
      - run: python3 scripts/verify-resources.py -- pnpm --filter app build
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter app exec playwright install --with-deps chromium
      - run: pnpm --filter app e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-diagnostics
          path: app/test-results/
          retention-days: 7
  # Rust (Windows) is enforced independently by windows.yml; this aggregate is supplemental.
  ci-ok:
    if: always()
    needs: [changes, rust, frontend, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$NEEDS" | jq -e --arg code "$CODE" \
            'to_entries | all(.value.result == "success" or ($code == "false" and .key != "changes" and .value.result == "skipped"))'
