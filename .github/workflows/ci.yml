name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # 바뀐 파일이 docs/ 와 루트 Markdown뿐이면 무거운 job을 건너뛴다(계획 갱신에 전체 CI를 돌리지 않음, 사용자 요청 2026-10-08).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$EVENT" = "push" ] && [ "$BASE" = "0000000000000000000000000000000000000000" ]; }; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}"; then
              echo "Scope gate: missing or unreadable baseline commit: $BASE" >&2
              exit 1
            fi
            # Count both sides of renames. Diff errors abort before classification.
            git diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/devbox-changed-files"
            status=0
            grep -vE '^(docs/|[^/]+\.md$)' "$RUNNER_TEMP/devbox-changed-files" > /dev/null || status=$?
            case "$status" in
              0) echo "code=true" >> "$GITHUB_OUTPUT" ;;
              1) echo "code=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "Scope gate: file classification failed (grep exit $status)" >&2; exit "$status" ;;
            esac
          fi
  rust:
    name: Rust (Cargo workspace)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/tests/test_scaffold.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: bash scripts/banned-words.sh
      - run: cargo run -q -p xtask -- gen-ts --check
  # Task 21–24에서 실제 Frontend/Windows native 검사와 needs를 추가한다.
  # ci-ok는 보조 집계다. 기존 필수 native 검사·보호 규칙을 약화하지 않는다.
  # needs가 실패하면 이 job이 skipped가 되어 필수 검사가 통과로 보이는 것을 막으려고 always()로 돌리고 결과를 직접 본다.
  # 문서만 바뀐 경우(code=false)에만 changes 밖 job의 skipped를 통과로 인정한다.
  ci-ok:
    if: always()
    needs: [changes, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$NEEDS" | jq -e --arg code "$CODE" \
            'to_entries | all(.value.result == "success" or ($code == "false" and .key != "changes" and .value.result == "skipped"))'
