name: Windows package candidate

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Intended stable tag (for example, v0.6.0); the tag must not exist"
        required: true
        type: string
      candidate_commit:
        description: "Exact current main commit to package (40 lowercase hex characters)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-package-candidate
  cancel-in-progress: false

jobs:
  plan:
    name: Validate source and plan package shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - id: identity
        name: Require the exact unpublished current main source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-release-input.py \
            --event workflow_dispatch \
            --tag "$CANDIDATE_TAG" \
            --allow-prerelease false
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          if [[ ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_commit must be 40 lowercase hexadecimal characters"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_COMMIT" ]]; then
            echo "checkout does not match candidate_commit"
            exit 1
          fi
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_main" != "$CANDIDATE_COMMIT" ]]; then
            echo "candidate_commit is not the exact current origin/main"
            exit 1
          fi
          if [[ -n "$(git ls-remote --tags --refs origin "refs/tags/$CANDIDATE_TAG")" ]]; then
            echo "candidate tag already exists"
            exit 1
          fi
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "candidate release already exists"
            exit 1
          fi
          echo "artifact_name=windows-package-candidate-$CANDIDATE_TAG-$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"

      - id: shards
        name: Plan two bounded product shards
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/plan-windows-package-shards.py \
            --catalog apps/catalog.json \
            --shards 2 \
            --github-output "$GITHUB_OUTPUT"

  workspace-wsl-helper:
    needs: plan
    name: Build required static Workspace component
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-wsl-musl
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build production helper and separate private LSP fixture
        run: |
          cargo build --locked --release -p workspace-wsl --target x86_64-unknown-linux-musl
          node .github/scripts/workspace-wsl-artifact.mjs prepare target/x86_64-unknown-linux-musl/release/devbox-workspace-wsl "$GITHUB_SHA"
          cargo build --locked --release -p workspace-wsl --features test-fixtures --bin workspace-lsp-fixture --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-workspace-component-${{ github.run_id }}
          path: apps/devbox-workspace/src-tauri/resources/wsl/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-private-wsl-lsp-${{ github.run_id }}
          path: target/x86_64-unknown-linux-musl/release/workspace-lsp-fixture
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build Windows products (shard ${{ matrix.shard }})
    needs: [plan, workspace-wsl-helper]
    runs-on: windows-2025
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: devbox-windows-package
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: candidate-workspace-component-${{ github.run_id }}
          path: apps/devbox-workspace/src-tauri/resources/wsl
      - name: Stage the pinned helper for Knowledge document operations
        run: node .github/scripts/workspace-wsl-artifact.mjs stage-knowledge "${{ github.sha }}"
      - name: Build each assigned product once, including required components
        shell: pwsh
        env:
          SHARD_APPS: ${{ matrix.apps }}
        run: |
          $apps = @($env:SHARD_APPS -split ',')
          if ($apps.Count -ne ${{ matrix.app_count }}) { throw 'Shard input count mismatch.' }
          .github/scripts/build-windows-packages.ps1 -StagingRoot candidate/staging -AppIds $apps
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package-candidate-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: candidate/staging
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: contains(matrix.apps, 'devbox-workspace')
        with:
          name: candidate-private-windows-lsp-${{ github.run_id }}
          path: target/release/fake-lsp-server.exe
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble and verify unpublished candidate
    needs: [plan, build]
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ needs.plan.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-package-candidate-shard-${{ github.run_id }}-*
          path: candidate/shards
          merge-multiple: false
      - name: Assemble one Suite setup and four product ZIPs with exact source provenance
        shell: pwsh
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: .github/scripts/assemble-suite-candidate.ps1 -Shards candidate/shards -Output candidate/output -Tag $env:CANDIDATE_TAG -Source $env:CANDIDATE_COMMIT
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: |
            candidate/output/assets
            candidate/output/evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  packaged-runtime:
    name: Packaged native acceptance (${{ matrix.scope }})
    needs: assemble
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scope: [product-shells, api, knowledge, cross-product]
    env:
      DEVBOX_FIXTURE_PROFILE: release
      DEVBOX_PORTABLE_FIXTURES: target/portable-fixture
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.assemble.outputs.artifact_name }}
          path: candidate
      - uses: actions/download-artifact@v8
        if: matrix.scope == 'product-shells'
        with:
          name: candidate-private-windows-lsp-${{ github.run_id }}
          path: target/debug
      - uses: actions/download-artifact@v8
        if: matrix.scope == 'product-shells'
        with:
          name: candidate-private-wsl-lsp-${{ github.run_id }}
          path: target/native-lsp-fixture
      - uses: actions/checkout@v7
        if: matrix.scope != 'cross-product'
        with:
          ref: 3a23f49c85aa3c3d04b86f227e8aa184ef964085
          path: baseline-source
          persist-credentials: false
      - name: Measure only the matching pinned anchors on this same VM
        if: matrix.scope != 'cross-product'
        shell: pwsh
        run: |
          $anchors = switch ('${{ matrix.scope }}') {
            'product-shells' { @('workbench','devbox-manager','run-manager','wsl-desktop') }
            'api' { @('api-playground') }
            'knowledge' { @('knowledge-base','everything-plus') }
          }
          .github/scripts/windows-product-performance.ps1 -Apps $anchors
      - name: Materialize exact release bytes for native fixtures without rebuilding
        shell: pwsh
        run: |
          python .github/scripts/prepare-suite-runtime.py candidate/assets --source '${{ inputs.candidate_commit }}'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate runtime materialization failed.' }
          if ('${{ matrix.scope }}' -eq 'product-shells') {
            "DEVBOX_WORKSPACE_LSP_FIXTURE=$((Resolve-Path target/native-lsp-fixture/workspace-lsp-fixture).Path)" >> $env:GITHUB_ENV
          }
      - name: Prepare owned WSL1 filesystem for actual Source and Knowledge flows
        if: matrix.scope == 'product-shells' || matrix.scope == 'knowledge'
        shell: pwsh
        run: .github/scripts/windows-knowledge-wsl.ps1
      - name: Provision Git only in the owned filesystem fixture
        if: matrix.scope == 'product-shells'
        shell: pwsh
        run: .github/scripts/windows-workspace-wsl-git.ps1
      - name: Execute the complete selected native scope
        shell: pwsh
        run: |
          $scripts = switch ('${{ matrix.scope }}') {
            'product-shells' { @('windows-product-foundation.mjs') }
            'api' { @('windows-api-migration.mjs','windows-api-lifecycle.mjs','windows-api-workflow.mjs') }
            'knowledge' { @('windows-knowledge-migration.mjs') }
            'cross-product' { @('windows-suite-workflows.mjs') }
          }
          $failed = @()
          foreach ($script in $scripts) {
            node ".github/scripts/$script"
            if ($LASTEXITCODE -ne 0) { $failed += $script }
          }
          if ($failed.Count -gt 0) { throw "Native scopes failed: $($failed -join ', ')" }
      - name: Record matched same-host performance comparisons
        if: matrix.scope != 'cross-product'
        run: node .github/scripts/compare-product-performance.mjs '${{ matrix.scope }}'
      - name: Remove only the owned WSL1 fixture
        if: ${{ always() && (matrix.scope == 'product-shells' || matrix.scope == 'knowledge') }}
        shell: pwsh
        run: .github/scripts/windows-knowledge-wsl.ps1 -Cleanup
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: candidate-native-${{ matrix.scope }}-${{ github.run_id }}
          path: |
            product-foundation-evidence
            performance-baseline/*.json
          if-no-files-found: error
          retention-days: 14

  installer-acceptance:
    name: Installer migration update recovery and removal acceptance
    needs: assemble
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.assemble.outputs.artifact_name }}
          path: candidate
      - name: Recover the exact private payload from public bytes
        shell: pwsh
        run: |
          python .github/scripts/prepare-suite-fixture.py candidate/assets candidate/delivery --source '${{ inputs.candidate_commit }}' --run-id '${{ github.run_id }}'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate delivery inputs failed.' }
      - name: Exercise full installed Suite migration and recovery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEVBOX_SUITE_ARTIFACT_SOURCE: ${{ inputs.candidate_commit }}
          DEVBOX_SUITE_ARTIFACT_RUN: ${{ github.run_id }}
        run: .github/scripts/windows-suite-delivery.ps1 -Staging candidate/delivery -Bootstrap candidate/delivery/devbox-suite-bootstrap.exe
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: candidate-installer-${{ github.run_id }}
          path: product-foundation-evidence
          if-no-files-found: error
          retention-days: 14

  windows-wsl2:
    name: Exact candidate WSL2 and Docker acceptance on disposable VM
    needs: assemble
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.assemble.outputs.artifact_name }}
          path: candidate
      - name: Export the same verified Workspace bytes with source receipt
        shell: pwsh
        run: |
          python .github/scripts/prepare-suite-runtime.py candidate/assets --source '${{ inputs.candidate_commit }}'
          if ($LASTEXITCODE -ne 0) { throw 'Workspace candidate extraction failed.' }
          $destination = Join-Path $env:RUNNER_TEMP 'workspace-webview-fixture'
          New-Item -ItemType Directory -Path "$destination/resources/wsl" -Force | Out-Null
          $files = [ordered]@{
            'devbox-workspace.exe' = 'target/debug/devbox-workspace.exe'
            'resources/wsl/devbox-workspace-wsl' = 'apps/devbox-workspace/src-tauri/resources/wsl/devbox-workspace-wsl'
            'resources/wsl/manifest.json' = 'apps/devbox-workspace/src-tauri/resources/wsl/manifest.json'
            'THIRD_PARTY_NOTICES.md' = 'candidate/assets/THIRD_PARTY_NOTICES.md'
          }
          $records = @()
          foreach ($entry in $files.GetEnumerator()) {
            $target = Join-Path $destination $entry.Key
            Copy-Item -LiteralPath $entry.Value -Destination $target
            $records += @{path=$entry.Key;size=(Get-Item $target).Length;sha256=(Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          @{schemaVersion=1;purpose='owned-workspace-webview-acceptance';sourceSha=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;buildProfile='release';files=$records} | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 "$destination/fixture.json"
      - uses: actions/cache/restore@v6
        id: wsl2-rootfs-cache
        with:
          path: ${{ runner.temp }}/devbox-wsl-rootfs
          key: owned-wsl-rootfs-2a790896740b14d637dbdc583cce1ba081ac53b9e9cdb46dc09a2f73abbd9934
      - name: Prepare pinned WSL2 root filesystem
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $directory = Join-Path $env:RUNNER_TEMP 'devbox-wsl-rootfs'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $archive = Join-Path $directory 'ubuntu-rootfs.tar.gz'
          if (-not (Test-Path -LiteralPath $archive)) {
            Invoke-WebRequest -UseBasicParsing -TimeoutSec 180 -Uri 'https://cloud-images.ubuntu.com/wsl/releases/noble/current/ubuntu-noble-wsl-amd64-24.04lts.rootfs.tar.gz' -OutFile $archive
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2a790896740b14d637dbdc583cce1ba081ac53b9e9cdb46dc09a2f73abbd9934') { throw 'Owned root filesystem digest mismatch' }
      # Preserve verified input before the fixture, even when a later test fails.
      - uses: actions/cache/save@v6
        if: steps.wsl2-rootfs-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/devbox-wsl-rootfs
          key: owned-wsl-rootfs-2a790896740b14d637dbdc583cce1ba081ac53b9e9cdb46dc09a2f73abbd9934
      - name: Exercise the compiled artifact on an independent hosted WSL2 VM
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'devbox-wsl-rootfs/ubuntu-rootfs.tar.gz'
          $scope = 'all'
          .github/scripts/windows-workspace-owned-wsl2.ps1 -Scope $scope -Archive $archive -Digest '2a790896740b14d637dbdc583cce1ba081ac53b9e9cdb46dc09a2f73abbd9934' -AppArtifact (Join-Path $env:RUNNER_TEMP 'workspace-webview-fixture') -NodeScript (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/windows-workspace-owned-wsl2.mjs') -SourceSha $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -ArtifactSourceSha $env:GITHUB_SHA -ArtifactRunId $env:GITHUB_RUN_ID
      - name: Preserve isolated WSL2 acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-wsl2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workspace-webview-fixture/*acceptance.json
            ${{ runner.temp }}/workspace-webview-fixture/wsl2-details
          if-no-files-found: warn
          retention-days: 14
