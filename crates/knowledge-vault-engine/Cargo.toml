[package]
name = "devbox-knowledge-vault-engine"
version = "0.8.0"
publish = false
description = "Knowledge Base"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "knowledge_base_lib"
crate-type = ["rlib"]

# Products link the native component without embedding the legacy UI/entrypoint.
[features]
default = []



[dependencies]
workspace-wsl = { path = "../../apps/devbox-workspace/native", default-features = false }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
markdown = { path = "../markdown" }
search = { path = "../search" }
notify = { workspace = true }
devbox-integration = { package = "integration", path = "../integration" }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-wsl = { package = "wsl", path = "../wsl" }
product-contract = { path = "../product-contract" }

[target.'cfg(windows)'.dependencies]
# RegisterHotKey/GetMessageW/MoveFileExW are used only on Windows.  This version is
# already present in the workspace lockfile via filesystem/run-manager, so
# the quick-capture feature adds no runtime download or sidecar.
windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
