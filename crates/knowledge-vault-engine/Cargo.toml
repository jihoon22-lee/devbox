[package]
name = "devbox-knowledge-vault-engine"
version = "0.8.0"
publish = false
description = "Knowledge Base"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "knowledge_base_lib"
crate-type = ["rlib"]

# Products link the native component without embedding the legacy UI/entrypoint.
[features]
default = []



[dependencies]
workspace-wsl = { path = "../../apps/devbox-workspace/native", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
dirs = "6.0.0"
base64 = "0.22"
markdown = { path = "../markdown" }
search = { path = "../search" }
notify = "8.2.0"
devbox-integration = { package = "integration", path = "../integration" }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-wsl = { package = "wsl", path = "../wsl" }
product-contract = { path = "../product-contract" }

[target.'cfg(windows)'.dependencies]
# RegisterHotKey/GetMessageW/MoveFileExW are used only on Windows.  This version is
# already present in the workspace lockfile via filesystem/run-manager, so
# the quick-capture feature adds no runtime download or sidecar.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
