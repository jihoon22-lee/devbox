[package]
name = "devbox-toolbox-engine"
version = "0.8.0"
publish = false
description = "Developer Toolbox"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "developer_toolbox_lib"
crate-type = ["rlib"]

# A product component links the native implementation without embedding the
# legacy executable's frontend bundle or invoking its bootstrap.
[features]
default = []



[dependencies]
transforms-core = { path = "../transforms-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
getrandom = "0.4.3"
hmac = "0.13.0"
base64 = "0.22.1"
md-5 = "0.11.0"
sha2 = "0.11.0"
uuid = "1.24.0"
regex = "1.13.1"
similar = "3.1.2"
qrcode = { version = "0.14.1", default-features = false }
png = "0.18.1"
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-integration = { package = "integration", path = "../integration" }
zeroize = "1"
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3"
