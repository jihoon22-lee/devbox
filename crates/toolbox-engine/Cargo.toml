[package]
name = "devbox-toolbox-engine"
version = "0.8.0"
publish = false
description = "Developer Toolbox"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "developer_toolbox_lib"
crate-type = ["rlib"]

# A product component links the native implementation without embedding the
# legacy executable's frontend bundle or invoking its bootstrap.
[features]
default = []



[dependencies]
transforms-core = { path = "../transforms-core" }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
md-5 = "0.11.0"
sha2 = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
similar = "3.1.2"
qrcode = { workspace = true }
png = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-integration = { package = "integration", path = "../integration" }
zeroize = { workspace = true }
chrono = { workspace = true, features = ["default"] }

[dev-dependencies]
tempfile = { workspace = true }
