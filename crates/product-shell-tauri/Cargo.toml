[package]
name = "product-shell-tauri"
version = "0.1.0"
publish = false
edition = "2021"
description = "Native read-only product shell adapter"

[dependencies]
tauri = { workspace = true }
tauri-plugin-single-instance = "2"
catalog = { path = "../catalog" }
