[package]
name = "data-migration"
version = "0.1.0"
publish = false
edition = "2021"
description = "Devbox consistent snapshots and destination-owned import journal"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
devbox-filesystem = { package = "filesystem", path = "../filesystem" }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
