[package]
name = "integration"
version = "0.1.0"
publish = false
description = "devbox integration snapshot discovery, validation and atomic multi-view contract"
edition = "2021"

[lib]
name = "integration"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
