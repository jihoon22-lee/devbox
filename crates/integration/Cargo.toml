[package]
name = "integration"
version = "0.1.0"
publish = false
description = "devbox integration snapshot discovery, validation and atomic multi-view contract"
edition = "2021"

[lib]
name = "integration"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
chrono = { workspace = true, features = ["default"] }
iana-time-zone = "0.1"
