[package]
name = "devbox-http-client-engine"
version = "0.8.0"
publish = false
description = "API Playground"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "api_playground_lib"
crate-type = ["rlib"]

# A product component links the native implementation without embedding the
# legacy executable's frontend bundle or invoking its bootstrap.
[features]
default = []



[dependencies]
api-protocols = { path = "../api-protocols" }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["default"] }
futures-util = { workspace = true }
bytes = { workspace = true }
getrandom = { workspace = true }
prost = { workspace = true }
prost-types = "0.14"
prost-reflect = { workspace = true }
rustls-pki-types = "1.15.1"
devbox-secrets = { package = "secrets", path = "../secrets" }
base64 = { workspace = true }
zeroize = { workspace = true }
url = { workspace = true }
dirs = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-integration = { package = "integration", path = "../integration" }
tokio = { workspace = true }
tokio-stream = "0.1.17"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
tonic = { workspace = true }
tonic-reflection = { version = "0.14.6", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
tonic = { workspace = true }
tonic-prost = "0.14.6"
tonic-reflection = { version = "0.14.6", default-features = false, features = ["server"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
