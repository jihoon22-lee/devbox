[package]
name = "devbox-ports-engine"
version = "0.8.0"
publish = false
description = "Port & Process Manager"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Domain library names remain distinct from product executable names.
name = "ports_engine"
crate-type = ["rlib"]

# Product consumers reuse commands without embedding the standalone frontend.
[features]
default = ["desktop"]
desktop = []



[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
dirs = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-process = { package = "process", path = "../process" }
devbox-integration = { package = "integration", path = "../integration" }
devbox-applink = { package = "applink", path = "../applink" }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
devbox-wsl = { package = "wsl", path = "../wsl" }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
