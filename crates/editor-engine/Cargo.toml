[package]
name = "devbox-editor-engine"
version = "0.8.0"
publish = false
description = "Code Pad"
authors = ["jihoon22.lee"]
edition = "2021"

[lib]
name = "code_pad_lib"
crate-type = ["rlib"]

# Product consumers reuse native components without embedding legacy web assets.
[features]
default = ["desktop"]
preview = ["dep:devbox-markdown"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:devbox-applink", "preview", "dep:notify",
]



[dependencies]
tauri = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
encoding_rs = "0.8"
chardetng = "1"
base64 = { workspace = true }
sha2 = { workspace = true }
subtle = "2.6.1"
uuid = { workspace = true }
url = { workspace = true }
lsp-types = "0.97.0"
notify = { workspace = true, optional = true }
reqwest = { workspace = true }
flate2 = "1.1.9"
tar = { version = "0.4.46", default-features = false }
zip = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-wsl = { package = "wsl", path = "../wsl" }
devbox-markdown = { package = "markdown", path = "../markdown", optional = true }
devbox-applink = { package = "applink", path = "../applink", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "fake-lsp-server"
path = "tests/fixtures/fake_lsp_server.rs"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
