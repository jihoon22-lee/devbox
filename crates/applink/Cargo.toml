[package]
name = "applink"
version = "0.1.0"
publish = false
description = "devbox 앱 간 인바운드 실행 계약 — argv ↔ OpenRequest 파싱/빌드 (전방 호환)"
edition = "2021"

[lib]
name = "applink"
path = "src/lib.rs"

[dependencies]
ts-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
