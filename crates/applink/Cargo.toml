[package]
name = "applink"
version = "0.1.0"
publish = false
description = "devbox 앱 간 인바운드 실행 계약 — argv ↔ OpenRequest 파싱/빌드 (전방 호환)"
edition = "2021"

[lib]
name = "applink"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4.3"
devbox-filesystem = { package = "filesystem", path = "../filesystem" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
