[package]
name = "devbox-projects-engine"
version = "0.8.0"
publish = false
description = "Project Workspace Orchestrator"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Domain library names remain distinct from product executable names.
name = "projects_engine"
crate-type = ["rlib"]

# Product consumers reuse native components without embedding legacy web assets.
[features]
default = []



[dependencies]
product-contract = { path = "../product-contract" }
product-ipc = { workspace = true }
ts-rs = { workspace = true }
process-tree = { workspace = true, features = ["tokio"] }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
devbox-wsl = { package = "wsl", path = "../wsl" }
devbox-integration = { package = "integration", path = "../integration" }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-git = { package = "git", path = "../git" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-secrets = { package = "secrets", path = "../secrets" }
tokio = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
