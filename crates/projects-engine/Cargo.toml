[package]
name = "devbox-projects-engine"
version = "0.8.0"
publish = false
description = "Project Workspace Orchestrator"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "workbench_lib"
crate-type = ["rlib"]

# Product consumers reuse native components without embedding legacy web assets.
[features]
default = []



[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
devbox-wsl = { package = "wsl", path = "../wsl" }
devbox-integration = { package = "integration", path = "../integration" }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-git = { package = "git", path = "../git" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-secrets = { package = "secrets", path = "../secrets" }
tokio = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
