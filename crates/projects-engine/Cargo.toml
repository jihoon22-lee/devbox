[package]
name = "devbox-projects-engine"
version = "0.8.0"
publish = false
description = "Project Workspace Orchestrator"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "workbench_lib"
crate-type = ["rlib"]

# Product consumers reuse native components without embedding legacy web assets.
[features]
default = []



[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
devbox-wsl = { package = "wsl", path = "../wsl" }
devbox-integration = { package = "integration", path = "../integration" }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-launch = { package = "launch", path = "../launch" }
devbox-git = { package = "git", path = "../git" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-secrets = { package = "secrets", path = "../secrets" }
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11.0"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
