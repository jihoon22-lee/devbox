[package]
name = "suite-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
product-contract = { path = "../product-contract" }
product-shell-tauri = { path = "../product-shell-tauri" }
devbox-catalog = { package = "catalog", path = "../catalog" }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "sync", "rt", "time", "io-util", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security"] }
