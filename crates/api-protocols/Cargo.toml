[package]
name = "api-protocols"
version = "0.1.0"
publish = false
edition = "2021"
description = "Shared API protocol validation and codecs"

[dependencies]
base64 = "0.22"
bytes = "1"
getrandom = "0.4.3"
prost = "0.14"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.9.1"
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tonic = { version = "0.14.6", default-features = false }
url = "2"
zeroize = "1"
devbox-filesystem = { package = "filesystem", path = "../filesystem" }

[dev-dependencies]
tempfile = "3"
