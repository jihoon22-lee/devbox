[package]
name = "devbox-webhook-host"
version = "0.8.0"
publish = false
description = "Local Mock/Webhook Server"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Domain library names remain distinct from product executable names.
name = "webhook_host"
crate-type = ["rlib"]

# A product component links the native implementation without embedding the
# legacy executable's frontend bundle or invoking its bootstrap.
[features]
default = []



[dependencies]
product-ipc = { workspace = true }
ts-rs = { workspace = true }
webhook-core = { path = "../webhook-core" }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-integration = { package = "integration", path = "../integration" }

[dev-dependencies]
tempfile = { workspace = true }
