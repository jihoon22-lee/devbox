[package]
name = "devbox-terminal-engine"
version = "0.8.0"
publish = false
description = "WSL Desktop"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wsl_desktop_lib"
crate-type = ["rlib"]

[features]
default = ["desktop"]
desktop = []



[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tokio = { version = "1.53.1", features = ["process", "time", "macros", "rt", "io-util", "sync"] }
devbox-wsl = { package = "wsl", path = "../wsl" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-integration = { package = "integration", path = "../integration" }
devbox-launch = { package = "launch", path = "../launch" }
dirs = "6.0.0"
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1.7"
