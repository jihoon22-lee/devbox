[package]
name = "devbox-terminal-engine"
version = "0.8.0"
publish = false
description = "WSL Desktop"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wsl_desktop_lib"
crate-type = ["rlib"]

[features]
default = ["desktop"]
desktop = []



[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
portable-pty = "0.9.0"
tokio = { workspace = true }
devbox-wsl = { package = "wsl", path = "../wsl" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-integration = { package = "integration", path = "../integration" }
dirs = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1.7"
