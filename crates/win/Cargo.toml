[package]
name = "devbox-win"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
zeroize.workspace = true
sha2.workspace = true
devbox-activity = { path = "../activity", default-features = false }
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_SystemInformation"] }
