[package]
name = "transforms-core"
version = "0.1.0"
publish = false
edition = "2021"
description = "Shared transforms-core validation and persistence codecs"

[dependencies]
ts-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
qrcode = { workspace = true }
png = { workspace = true }
chrono = { workspace = true, features = ["default"] }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-applink = { package = "applink", path = "../applink" }

[dev-dependencies]
tempfile = { workspace = true }
