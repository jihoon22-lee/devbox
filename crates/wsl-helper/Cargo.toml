[package]
name = "workspace-wsl"
version = "0.1.0"
publish = false
edition.workspace = true

[features]
default = ["helper"]
test-fixtures = ["helper"]
helper = ["git", "files", "dep:libc", "editor_engine/preview", "dep:repositories_engine", "dep:tokio"]
files = ["dep:editor_engine", "dep:product-contract", "dep:devbox-wsl", "dep:devbox-filesystem", "dep:sha2", "dep:windows"]

git = ["files", "dep:devbox-git", "dep:gix-config"]

[lib]
name = "workspace_wsl"

[[bin]]
name = "devbox-workspace-wsl"
path = "src/main.rs"
required-features = ["helper"]

[dependencies]
gix-config = { version = "=0.60.0", default-features = false, features = ["sha1"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem", optional = true }
sha2 = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[dependencies.editor_engine]
package = "devbox-editor-engine"
path = "../editor-engine"
default-features = false
optional = true

[dependencies.product-contract]
path = "../product-contract"
optional = true

[dependencies.devbox-wsl]
package = "wsl"
path = "../wsl"
optional = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[dependencies.devbox-git]
package = "git"
path = "../git"
optional = true

[dependencies.repositories_engine]
package = "devbox-repositories-engine"
path = "../repositories-engine"
default-features = false
optional = true

[dependencies.tokio]
workspace = true
optional = true

[[bin]]
name = "workspace-lsp-fixture"
path = "tests/support/lsp_fixture.rs"
required-features = ["test-fixtures"]
test = false

[[test]]
name = "lsp_pipe"
path = "tests/lsp_pipe.rs"
required-features = ["test-fixtures"]
