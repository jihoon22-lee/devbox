[package]
name = "devbox-activity-engine"
version = "0.8.0"
publish = false
description = "Auto Life Log"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Domain library names remain distinct from product executable names.
name = "activity_engine"
crate-type = ["rlib"]

# Products link the native component without embedding the legacy UI/entrypoint.
[features]
default = []



[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
devbox-git = { package = "git", path = "../git" }
dirs = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-integration = { package = "integration", path = "../integration" }
devbox-applink = { package = "applink", path = "../applink" }
sysinfo = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { workspace = true }
