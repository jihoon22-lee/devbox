[package]
name = "devbox-logs-engine"
version = "0.8.0"
publish = false
description = "Bounded local log viewer"
authors = ["jihoon22.lee"]
edition = "2021"

[lib]
name = "log_lens_lib"
crate-type = ["rlib"]

# Product consumers reuse commands without embedding the standalone frontend.
[features]
default = ["desktop"]
desktop = []



[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
wsl = { path = "../wsl" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-integration = { package = "integration", path = "../integration" }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
dirs = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
