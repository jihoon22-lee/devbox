[package]
name = "product-contract"
version = "0.1.0"
publish = false
edition = "2021"
description = "Bounded product shell request and provenance contracts"

[dependencies]
devbox-catalog = { package = "catalog", path = "../catalog" }
sha2 = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
applink = { path = "../applink" }
devbox-secrets = { package = "secrets", path = "../secrets" }

[dev-dependencies]
tempfile = "3"
