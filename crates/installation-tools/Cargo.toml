[package]
name = "devbox-installation-tools"
version = "0.8.0"
publish = false
description = "Devbox Manager"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []


[lib]
# Domain library names remain distinct from product executable names.
name = "installation_tools"
crate-type = ["rlib"]


[dependencies]
product-ipc = { workspace = true }
ts-rs = { workspace = true }
process-tree = { workspace = true }
product-contract = { path = "../product-contract" }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10.0"
sha2 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
devbox-wsl = { package = "wsl", path = "../wsl" }
devbox-git = { package = "git", path = "../git" }
dirs = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-catalog = { package = "catalog", path = "../catalog" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
