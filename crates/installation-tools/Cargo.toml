[package]
name = "devbox-manager"
version = "0.5.1"
publish = false
description = "Devbox Manager"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["standalone"]
standalone = []

[[bin]]
name = "devbox-manager"
path = "src/main.rs"
required-features = ["standalone"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devbox_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
semver = "1.0.28"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite", "hooks", "limits"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
sha2 = "0.10"
getrandom = "0.4.3"
zeroize = "1"
futures-util = "0.3"
devbox-wsl = { package = "wsl", path = "../wsl" }
devbox-git = { package = "git", path = "../git" }
dirs = "6.0.0"
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-window-state-tauri = { package = "window-state-tauri", path = "../window-state-tauri" }
devbox-catalog = { package = "catalog", path = "../catalog" }
devbox-launch = { package = "launch", path = "../launch" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-integration = { package = "integration", path = "../integration" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
