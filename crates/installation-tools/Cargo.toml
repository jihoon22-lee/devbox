[package]
name = "devbox-installation-tools"
version = "0.8.0"
publish = false
description = "Devbox Manager"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []


[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devbox_manager_lib"
crate-type = ["rlib"]


[dependencies]
product-contract = { path = "../product-contract" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
getrandom = "0.4.3"
zeroize = "1"
devbox-wsl = { package = "wsl", path = "../wsl" }
devbox-git = { package = "git", path = "../git" }
dirs = "6.0.0"
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-catalog = { package = "catalog", path = "../catalog" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
