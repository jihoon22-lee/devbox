[package]
name = "launch"
version = "0.1.0"
publish = false
description = "Installed devbox app exe resolution and launch (pure path/process logic)"
edition = "2021"

[lib]
name = "launch"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
devbox-applink = { package = "applink", path = "../applink" }
devbox-catalog = { package = "catalog", path = "../catalog" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
