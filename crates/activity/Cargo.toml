[package]
name = "devbox-activity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# `model`, the RPC types and declarations build without the daemon (`default-features
# = false`, Windows app and `crates/win`); storage, rules files and the service need it.
[features]
default = ["daemon"]
daemon = [
    "dep:devbox-core",
    "dep:rusqlite",
    "dep:tokio",
    "dep:toml_edit",
    "dep:chrono",
    "dep:toml",
    "dep:rustix",
    "dep:sha2",
    "dep:tracing",
    "dep:uuid",
]

[dependencies]
devbox-protocol.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
devbox-core = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }
toml = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
