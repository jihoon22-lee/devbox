[package]
name = "git"
version = "0.1.0"
publish = false
description = "Stable git subprocess execution for Windows (absolute path resolution + std process)"
edition = "2021"

[lib]
name = "git"
path = "src/lib.rs"

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
