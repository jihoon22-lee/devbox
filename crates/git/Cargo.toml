[package]
name = "git"
version = "0.1.0"
publish = false
description = "Stable git subprocess execution for Windows (absolute path resolution + std process)"
edition = "2021"

[lib]
name = "git"
path = "src/lib.rs"

[dependencies]
process-tree = { workspace = true }
devbox-wsl = { package = "wsl", path = "../wsl" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
