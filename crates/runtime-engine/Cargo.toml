[package]
name = "devbox-runtime-engine"
version = "0.8.0"
publish = false
description = "Scheduled job and service manager"
authors = ["jihoon22.lee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Domain library names remain distinct from product executable names.
name = "runtime_engine"
crate-type = ["rlib"]

# Product consumers reuse commands without embedding the standalone frontend.
[features]
default = ["desktop"]
desktop = []



[dependencies]
tauri = { workspace = true }
tauri-plugin-notification = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml-08 = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true, features = ["default"] }
croner = "3.0.1"
regex = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
devbox-wsl = { package = "wsl", path = "../wsl" }
devbox-integration = { package = "integration", path = "../integration" }
devbox-applink = { package = "applink", path = "../applink" }
devbox-secrets = { package = "secrets", path = "../secrets" }
dirs = { workspace = true }
devbox-filesystem = { package = "filesystem", path = "../filesystem" }
devbox-window-state-tauri = { package = "window-state-tauri", path = "../window-state-tauri" }

[dev-dependencies]
tempfile = { workspace = true }
chrono-tz = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
