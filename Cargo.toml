[workspace]
resolver = "3"
members = ["crates/protocol", "crates/mux", "crates/core", "crates/projects", "crates/cli", "crates/terminal", "crates/git", "crates/agents", "crates/win", "crates/runtime", "crates/observe", "crates/secrets", "xtask", "crates/api"]
exclude = ["app/src-tauri"]

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
devbox-protocol = { path = "crates/protocol" }
devbox-mux = { path = "crates/mux" }
devbox-core = { path = "crates/core" }
devbox-projects = { path = "crates/projects" }
devbox-cli = { path = "crates/cli" }
devbox-terminal = { path = "crates/terminal" }
devbox-git = { path = "crates/git" }
devbox-agents = { path = "crates/agents" }
devbox-runtime = { path = "crates/runtime" }
devbox-observe = { path = "crates/observe" }
devbox-secrets = { path = "crates/secrets" }
devbox-api = { path = "crates/api" }
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
data-encoding = "2"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libc = "0.2"
mimalloc = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "process", "fs"] }
tokio-tungstenite = "0.27"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = "0.9"
toml_edit = { version = "0.23", features = ["serde"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
cookie_store = "0.22"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
lto = "thin"
