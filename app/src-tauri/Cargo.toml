[package]
name = "devbox-app"
version = "1.0.0-dev"
edition = "2024"
publish = false

[lib]
name = "devbox_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Devbox"
path = "src/main.rs"

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
zeroize = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
tempfile = "3"
devbox-mux = { path = "../../crates/mux" }
devbox-protocol = { path = "../../crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
global-hotkey = "0.8"
[target.'cfg(windows)'.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
devbox-win = { path = "../../crates/win" }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
winreg = "0.55"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
